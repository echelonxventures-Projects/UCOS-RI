      x-ucos-kind: command
      x-ucos-emits:
      - PaymentApplied
      description: Default allocation oldest-first per policy billing.allocation
      responses:
        '200':
          description: Command accepted
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../kernel/command-result.schema.json
        default:
          $ref: '#/components/responses/Problem'
      x-ucos-permission-candidates:
      - billing.account.manage
      - billing.charge.create
      - billing.billrun.start
      - billing.invoice.issue
      - billing.creditnote.issue
      - billing.writeoff
      - billing.payment.apply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paymentRef: {}
                allocations:
                  type: array
                  items:
                    type: object
                    properties:
                      invoiceRef: {}
                      amount: {}
                    required:
                    - invoiceRef
                    - amount
              required:
              - paymentRef
              - allocations
      parameters:
      - $ref: '#/components/parameters/UcosTenant'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
  /v1/billing/payment-applications/{applicationId}:reverse:
    post:
      operationId: ReverseApplication
      tags:
      - DOM-BIL
      summary: ReverseApplication
      x-ucos-kind: command
      x-ucos-emits:
      - PaymentApplicationReversed
      responses:
        '200':
          description: Command accepted
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../kernel/command-result.schema.json
        default:
          $ref: '#/components/responses/Problem'
      x-ucos-permission-candidates:
      - billing.account.manage
      - billing.charge.create
      - billing.billrun.start
      - billing.invoice.issue
      - billing.creditnote.issue
      - billing.writeoff
      - billing.payment.apply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                applicationId: {}
                reason: {}
              required:
              - applicationId
              - reason
      parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/UcosTenant'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
components:
  schemas:
    BillingAccount:
      type: object
      properties:
        id:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
        payer:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: PartyUrn
        issuingEntity:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: OrganizationUrn
        currency:
          type: string
          pattern: ^[A-Z]{3}$|^X-[A-Z0-9-]+$
        billCycle:
          type: object
          properties:
            frequency: {}
            anchorDay: {}
            timezone: {}
          required:
          - frequency
          - anchorDay
          - timezone
        paymentTerms:
          $ref: '#/components/schemas/PaymentTerms'
        invoiceDelivery:
          type: object
          properties:
            channels:
              type: array
              items: {}
            format:
              description: pdf|e-invoice standard
            recipients:
              description: contact refs
          required:
          - channels
          - format
          - recipients
        parentAccount:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
        taxProfile:
          type: object
          properties:
            exemptions:
              type: array
              items: {}
            taxIds:
              type: array
              items: {}
            jurisdictionHints: {}
          required:
          - exemptions
          - taxIds
          - jurisdictionHints
        lifecycleState:
          type: string
        revision:
          type: integer
          format: int64
      x-ucos-identity: urn:ucos:<tenant>:billing-account:<ulid>
      x-ucos-invariants:
      - 'INV-BIL-1: single currency per account (multi-currency via multiple accounts).'
      - 'INV-BIL-2: issuing legal entity (organization) fixed per account unless migrated via governed process.'
      - 'INV-BIL-3: account hierarchy acyclic; payer responsibility resolves to exactly one paying account per charge.'
      required:
      - id
      - payer
      - issuingEntity
      - currency
      - billCycle
      - paymentTerms
      - invoiceDelivery
      - taxProfile
      - lifecycleState
      - revision
    Charge:
      type: object
      properties:
        accountRef:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
        chargeType:
          type: string
          enum:
          - one-time
          - recurring
          - usage
          - adjustment
          - fee
        amount:
          $ref: ../kernel/money.schema.json
        quantity:
          $ref: ../kernel/quantity.schema.json
        period:
          type: object
          properties:
            from: {}
            to: {}
          required:
          - from
          - to
        priceComponents:
          type: array
          items:
            description: PriceComponent
            x-ucos-type: PriceComponent
        source:
          type: object
          properties:
            kind:
              type: string
              enum:
              - order
              - contract
              - subscription
              - entitlement-consumption
              - manual
            ref: {}
            lineRef: {}
          required:
          - kind
          - ref
          - lineRef
        billableFrom:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - unbilled
          - billed
          - cancelled
        invoiceRef:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
      x-ucos-identity: urn:ucos:<tenant>:charge:<ulid>
      x-ucos-invariants:
      - 'INV-BIL-4: unique per (sourceRef, sourceLineRef, period) — idempotent charge creation.'
      - 'INV-BIL-5: a charge is billed on at most one issued invoice.'
      required:
      - accountRef
      - chargeType
      - amount
      - priceComponents
      - source
      - billableFrom
      - status
    Invoice:
      type: object
      properties:
        kind:
          type: string
          enum:
          - invoice
          - credit-note
          - debit-note
          - pro-forma
        accountRef:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
        number:
          description: string? (assigned at issue)
          x-ucos-type: string? (assigned at issue)
        issueDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLine'
        taxes:
          type: array
          items:
            $ref: '#/components/schemas/TaxLine'
        totals:
          type: object
          properties:
            net: {}
            tax: {}
            gross: {}
            currency: {}
          required:
          - net
          - tax
          - gross
          - currency
        documentRef:
          description: rendered document (DOM-DOC) + e-invoice payload
          x-ucos-type: rendered document (DOM-DOC) + e-invoice payload
        openAmount:
          $ref: ../kernel/money.schema.json
        lifecycleState:
          type: string
      x-ucos-identity: urn:ucos:<tenant>:invoice:<ulid>
      x-ucos-invariants:
      - 'INV-BIL-6: issued invoices immutable; legal number assigned at issue from gapless series (number_series table, row-locked).'
      - 'INV-BIL-7: total = Σ lines + Σ taxes exactly in minor units; tax lines reference DOM-TAX DecisionRecords.'
      - 'INV-BIL-8: credit notes reference an issued invoice and cannot exceed its open creditable amount.'
      required:
      - kind
      - accountRef
      - number
      - issueDate
      - dueDate
      - lines
      - taxes
      - totals
      - documentRef
      - openAmount
      - lifecycleState
    InvoiceLine:
      type: object
      x-ucos-within: Invoice
      properties:
        lineNo: {}
        chargeRefs: {}
        description:
          description: LocalizedText resolved at issue
        quantity: {}
        unitAmount: {}
        amount: {}
        period: {}
        taxCategory: {}
      required:
      - lineNo
      - chargeRefs
      - description
      - quantity
      - unitAmount
      - amount
      - period
      - taxCategory
    TaxLine:
      type: object
      x-ucos-within: Invoice
      properties:
        jurisdiction: {}
        taxType: {}
        rate: {}
        taxableAmount: {}
        taxAmount: {}
        decisionRef: {}
      required:
      - jurisdiction
      - taxType
      - rate
      - taxableAmount
      - taxAmount
      - decisionRef
    BillingSchedule:
      type: object
      x-ucos-within: Charge source (stored per subscription/contract)
      properties:
        scheduleId: {}
        accountRef: {}
        recurringSpec: {}
        startAt: {}
        endAt: {}
        prorationPolicyRef: {}
        status: {}
      required:
      - scheduleId
      - accountRef
      - recurringSpec
      - startAt
      - endAt
      - prorationPolicyRef
      - status
    Dispute:
      type: object
      x-ucos-within: Invoice
      properties:
        disputeId: {}
        lineRefs: {}
        amount: {}
        reason: {}
        status: {}
        resolution: {}
      required:
      - disputeId
      - lineRefs
      - amount
      - reason
      - status
      - resolution
    DunningCase:
      type: object
      x-ucos-within: BillingAccount
      properties:
        caseId: {}
        invoiceRefs: {}
        step: {}
        nextActionAt: {}
        status: {}
      required:
      - caseId
      - invoiceRefs
      - step
      - nextActionAt
      - status
    PaymentTerms:
      description: As DOM-CTR
      x-ucos-value-object: true
    InvoiceNumberSeries:
      type: object
      properties:
        issuingEntity: {}
        seriesCode: {}
        prefix: {}
        nextValue: {}
        gapless:
          type: boolean
        resetPolicy: {}
      required:
      - issuingEntity
      - seriesCode
      - prefix
      - nextValue
      - gapless
      - resetPolicy
      x-ucos-value-object: true
  parameters:
    UcosTenant:
      name: UCOS-Tenant
      in: header
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{1,62}$
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema:
            $ref: ../kernel/problem.schema.json
