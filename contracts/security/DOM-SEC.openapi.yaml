components:
  schemas:
    KeyRecord:
      type: object
      properties:
        kid:
          type: string
        kind:
          type: string
          enum:
          - tenant-kek
          - subject-dek
          - signing
          - hmac
        subject:
          description: PartyUrn? (for subject DEKs)
          x-ucos-type: PartyUrn? (for subject DEKs)
        kmsRef:
          type: string
        version:
          type: integer
        status:
          type: string
          enum:
          - active
          - rotating
          - retired
          - destroyed
        destroyedAt:
          type: string
          format: date-time
      x-ucos-identity: urn:ucos:<tenant>:key:<kid>
      x-ucos-invariants:
      - 'INV-SEC-1: subject keys wrapped by an active tenant KEK; KEK material only in KMS/HSM.'
      - 'INV-SEC-2: destroy blocked while any legal hold covers the subject (DOM-EVD).'
      - 'INV-SEC-3: rotation keeps previous KEK version for decrypt until re-wrap completes.'
      required:
      - kid
      - kind
      - subject
      - kmsRef
      - version
      - status
    SecurityEvent:
      type: object
      properties:
        detectionRef:
          type: string
