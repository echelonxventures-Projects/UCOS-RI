components:
  schemas:
    SettlementAgreement:
      type: object
      properties:
        counterparty:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: PartyUrn
        role:
          type: string
          enum:
          - seller
          - reseller
          - distributor
          - agent
          - affiliate
          - licensor
          - partner
          - provider
        scope:
          description: ApplicabilityScope
          x-ucos-type: ApplicabilityScope
        models:
          type: array
          items:
            type: object
            properties:
              itemKind:
                type: string
                enum:
                - commission
                - fee
                - revenue-share
                - royalty
                - rebate
                - chargeback-pass-through
              basis:
                type: string
                enum:
                - gross
                - net
                - margin
                - units
              priceModel: {}
            required:
            - itemKind
            - basis
            - priceModel
        schedule:
          type: object
          properties:
            period:
              description: P1W|P2W|P1M
              x-ucos-type: P1W|P2W|P1M
            statementDayOffset: {}
            payoutDelayDays: {}
          required:
          - period
          - statementDayOffset
          - payoutDelayDays
        reserve:
          type: object
          properties:
            percent: {}
            holdDays: {}
          required:
          - percent
          - holdDays
        netting:
          type: boolean
        currency:
          type: string
          pattern: ^[A-Z]{3}$|^X-[A-Z0-9-]+$
        contractRef:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
        version:
          type: integer
        status:
          type: string
          enum:
          - active
          - suspended
          - terminated
      x-ucos-identity: urn:ucos:<tenant>:settlement-agreement:<ulid>
      x-ucos-invariants:
      - 'INV-STL-1: one active agreement version per (counterparty, scope, role) at any instant; models validate as PriceModels;
        schedule and currency set.'
      required:
      - counterparty
      - role
      - scope
      - models
      - schedule
      - netting
      - currency
      - version
      - status
    SettlementStatement:
      type: object
      properties:
        counterparty:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: PartyUrn
        period:
          type: object
          properties:
            from: {}
            to: {}
          required:
          - from
          - to
        openingBalance:
          $ref: ../kernel/money.schema.json
        itemsTotal:
          $ref: ../kernel/money.schema.json
        adjustments:
          $ref: ../kernel/money.schema.json
        reserveMovement:
          $ref: ../kernel/money.schema.json
        withholding:
          $ref: ../kernel/money.schema.json
        payable:
          $ref: ../kernel/money.schema.json
        status:
          type: string
          enum:
          - draft
          - finalized
          - paid
          - partially-paid
          - disputed
      x-ucos-identity: urn:ucos:<tenant>:settlement-statement:<ulid>
      x-ucos-invariants:
      - 'INV-STL-2: statement total = Σ items + adjustments - reserves held + reserves released, exactly; finalized statements
        immutable.'
      - 'INV-STL-3: payable = max(0, opening balance + total); negative carried forward when netting=true.'
      required:
      - counterparty
      - period
      - openingBalance
      - itemsTotal
      - adjustments
      - reserveMovement
      - withholding
      - payable
      - status
    Payout:
      type: object
      properties:
        statementRef:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
        amount:
          $ref: ../kernel/money.schema.json
        destination:
          description: payout method ref (DOM-PAY)
          x-ucos-type: payout method ref (DOM-PAY)
        paymentIntentRef:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
        status:
          type: string
          enum:
          - instructed
          - sent
          - settled
          - failed
          - returned
      x-ucos-identity: urn:ucos:<tenant>:payout:<ulid>
      x-ucos-invariants:
      - 'INV-STL-4: payout amount <= statement payable minus active holds; idempotent instruction to DOM-PAY.'
      required:
      - statementRef
      - amount
      - destination
      - status
    SettlementItem:
      type: object
      x-ucos-within: ledger (per counterparty)
      properties:
        itemId: {}
        agreementRef: {}
        sourceEventId: {}
        sourceRef: {}
        itemKind: {}
        amount: {}
        currency: {}
        occurredAt: {}
        statementRef: {}
      required:
      - itemId
      - agreementRef
      - sourceEventId
      - sourceRef
      - itemKind
      - amount
      - currency
      - occurredAt
      - statementRef
    Hold:
      type: object
      x-ucos-within: counterparty balance
      properties:
        holdId: {}
        reason: {}
        amount: {}
        placedBy: {}
        until: {}
        status: {}
      required:
      - holdId
      - reason
      - amount
      - placedBy
      - until
      - status
    Balance:
      type: object
      properties:
        counterparty: {}
        currency: {}
        accruedUnstated: {}
        statedUnpaid: {}
        reserves: {}
        holds: {}
        available: {}
      required:
      - counterparty
      - currency
      - accruedUnstated
      - statedUnpaid
      - reserves
      - holds
      - available
      x-ucos-value-object: true
  parameters:
    UcosTenant:
      name: UCOS-Tenant
      in: header
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{1,62}$
    Traceparent:
      name: traceparent
      in: header
