          x-ucos-type: ApplicabilityScope (jurisdiction, locale, channel, brand)
        dataContract:
          type: object
          x-ucos-kind: json-schema
        layout:
          description: template source + assets (digests)
          x-ucos-type: template source + assets (digests)
        outputFormats:
          type: string
          enum:
          - pdf-a3
          - html
          - txt
        state:
          description: DefinitionState
          x-ucos-type: DefinitionState
      x-ucos-identity: urn:ucos:<namespace|tenant>:template:<code>@<semver>
      x-ucos-invariants:
      - 'INV-DOC-1: data contract (JSON Schema) present; every variable referenced in layout exists in the contract.'
      - 'INV-DOC-2: legal templates (kind invoice, credit-note, contract, terms) require approval with Legal/Finance role.'
      required:
      - code
      - kind
      - scope
      - dataContract
      - layout
      - outputFormats
      - state
    Clause:
      type: object
      properties:
        text:
          description: LocalizedText with variables
          x-ucos-type: LocalizedText with variables
        jurisdictions:
          type: array
          items:
            type: string
        approvedBy:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: PartyUrn
      x-ucos-identity: urn:ucos:<namespace|tenant>:clause:<code>@<semver>
      x-ucos-invariants: []
      required:
      - text
      - jurisdictions
      - approvedBy
    DocumentRecord:
      type: object
      properties:
        subject:
          description: Urn (invoice, contract, order…)
          x-ucos-type: Urn (invoice, contract, order…)
        templateRef:
          description: code@version
          x-ucos-type: code@version
        dataSnapshotDigest:
          type: string
          pattern: ^(sha256:)?[0-9a-f]{64}$
        locale:
          type: string
          pattern: ^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$
        contentRef:
          description: object storage ref
          x-ucos-type: object storage ref
        digest:
          type: string
          pattern: ^(sha256:)?[0-9a-f]{64}$
        evidenceRef:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
        status:
          type: string
          enum:
          - issued
          - voided
      x-ucos-identity: urn:ucos:<tenant>:document:<ulid>
      x-ucos-invariants:
      - 'INV-DOC-3: immutable once issued; digest of bytes stored; legal documents captured as Evidence.'
      required:
      - subject
      - templateRef
      - dataSnapshotDigest
      - locale
      - contentRef
      - digest
      - status
    Delivery:
      type: object
      x-ucos-within: DocumentRecord
      properties:
        deliveryId: {}
        channel: {}
        recipientRef: {}
        status: {}
        attempts: {}
        deliveredAt: {}
      required:
      - deliveryId
      - channel
      - recipientRef
      - status
      - attempts
      - deliveredAt
    DataSnapshot:
      description: Canonical JSON validated against template data contract; digest recorded
      x-ucos-value-object: true
