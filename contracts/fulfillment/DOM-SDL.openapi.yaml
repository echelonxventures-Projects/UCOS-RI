components:
  schemas:
    ServiceOrder:
      type: object
      properties:
        orderRef:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
        taskId:
          type: string
        action:
          type: string
          enum:
          - activate
          - modify
          - suspend
          - resume
          - terminate
          - schedule
          - perform
        assetRef:
          description: InstanceUrn? (Asset)
          x-ucos-type: InstanceUrn? (Asset)
        serviceSpec:
          description: objectRef + configuration
          x-ucos-type: objectRef + configuration
        executionMode:
          type: string
          enum:
          - provisioning-adapter
          - workflow
          - manual
        attempts:
          type: integer
        lifecycleState:
          type: string
      x-ucos-identity: urn:ucos:<tenant>:service-order:<ulid>
      x-ucos-invariants:
      - 'INV-SDL-1: unique per (orderRef, taskId); action valid for current asset service state.'
      - 'INV-SDL-2: failed provisioning after partial success triggers compensation steps declared by the task template.'
      required:
      - orderRef
      - taskId
      - action
      - assetRef
      - serviceSpec
      - executionMode
      - attempts
      - lifecycleState
    Appointment:
      type: object
      properties:
        serviceOrderRef:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
        capacityPoolRef:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
        slot:
          type: object
          properties:
            start: {}
            end: {}
            zone: {}
          required:
          - start
          - end
          - zone
        location:
          description: address ref
          x-ucos-type: address ref
        assignee:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: PartyUrn
        status:
          type: string
          enum:
          - booked
          - dispatched
          - in-progress
          - completed
          - no-show
          - cancelled
      x-ucos-identity: urn:ucos:<tenant>:appointment:<ulid>
      x-ucos-invariants: []
      required:
      - serviceOrderRef
      - capacityPoolRef
      - slot
      - location
      - status
    SlaMonitor:
      type: object
      properties:
        contractRef:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
        target:
          description: SlaTarget
          x-ucos-type: SlaTarget
        subject:
          description: assetRef | serviceRef
          x-ucos-type: assetRef | serviceRef
        windows:
          type: array
          items:
            type: object
            properties:
              start: {}
              end: {}
              measured: {}
              met: {}
              creditAmount: {}
            required:
            - start
            - end
            - measured
            - met
            - creditAmount
      x-ucos-identity: urn:ucos:<tenant>:sla-monitor:<ulid>
      x-ucos-invariants:
      - 'INV-SDL-3: measurement windows contiguous; credits computed only on closed windows from recorded measurements.'
      required:
      - contractRef
      - target
      - subject
      - windows
    Milestone:
      type: object
      x-ucos-within: ServiceOrder
      properties:
        milestoneId: {}
        description: {}
        dueAt: {}
        acceptanceRequired: {}
        acceptedBy: {}
        acceptedAt: {}
        evidenceRef: {}
      required:
      - milestoneId
      - description
      - dueAt
      - acceptanceRequired
      - acceptedBy
      - acceptedAt
      - evidenceRef
    ProvisioningResult:
      type: object
      properties:
        outcome:
          type: string
          enum:
          - succeeded
          - failed
          - pending
        externalRefs: {}
        serviceIdentifiers:
          description: e.g. MSISDN, tenant URL
        error: {}
      required:
      - outcome
      - externalRefs
      - serviceIdentifiers
      x-ucos-value-object: true
  parameters:
    UcosTenant:
      name: UCOS-Tenant
      in: header
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{1,62}$
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema:
            $ref: ../kernel/problem.schema.json
