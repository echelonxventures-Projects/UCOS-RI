components:
  schemas:
    EventType:
      type: object
      properties:
        type:
          type: string
        owningContext:
          type: string
        category:
          description: enum(domain, integration, command)
          x-ucos-type: enum(domain, integration, command)
        versions:
          type: array
          items:
            $ref: '#/components/schemas/SchemaVersion'
        classification:
          description: DataClassification
          x-ucos-type: DataClassification
        retention:
          type: object
          properties:
            logDays: {}
            compacted:
              type: boolean
          required:
          - logDays
          - compacted
        externalSubscribable:
          type: boolean
        state:
          description: DefinitionState
          x-ucos-type: DefinitionState
      x-ucos-identity: urn:ucos:ucos.std:eventtype:<type-without-version>
      x-ucos-invariants:
      - 'INV-EVT-1: type string matches CIC-000-002 grammar; context segment equals owning context.'
      - 'INV-EVT-2: each schema version within a MAJOR is FULL_TRANSITIVE compatible with all prior.'
      - 'INV-EVT-3: exactly one owning context (no two producers).'
      - 'INV-EVT-4: classification >= max sensitivity of any payload field.'
      required:
      - type
      - owningContext
      - category
      - versions
      - classification
      - retention
      - externalSubscribable
      - state
    Subscription:
      type: object
      properties:
        subscriber:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: PartyUrn
        types:
          type: array
          items:
            type: string
        filter:
          description: CEL over envelope + data
          x-ucos-type: CEL over envelope + data
        endpoint:
          type: string
          format: uri
        signingKeyRef:
          type: string
        status:
          description: enum(pending-verification, active, paused, failing, disabled)
          x-ucos-type: enum(pending-verification, active, paused, failing, disabled)
        deliveryStats:
          type: object
          properties:
            delivered: {}
            failed: {}
            lastSuccessAt: {}
          required:
          - delivered
          - failed
          - lastSuccessAt
      x-ucos-identity: urn:ucos:<tenant>:subscription:<ulid>
      x-ucos-invariants:
      - 'INV-EVT-5: only types with externalSubscribable=true; subscriber holds PDP grant eventing.subscribe for each type.'
      - 'INV-EVT-6: endpoint is HTTPS with verified ownership (challenge handshake).'
      required:
      - subscriber
      - types
      - filter
      - endpoint
      - signingKeyRef
      - status
      - deliveryStats
    SchemaVersion:
      type: object
      x-ucos-within: EventType
      properties:
        semver: {}
        schema:
          description: JSON Schema
        digest: {}
        registeredAt: {}
        compatibility: {}
      required:
      - semver
      - schema
      - digest
      - registeredAt
      - compatibility
    DeadLetter:
      type: object
      x-ucos-within: consumer (stored per consumer group)
      properties:
        eventId: {}
        topic: {}
        consumer: {}
        attempts: {}
        lastError: {}
        firstFailedAt: {}
        status: {}
      required:
      - eventId
      - topic
      - consumer
      - attempts
      - lastError
      - firstFailedAt
      - status
    CloudEventEnvelope:
      description: CIC-006-001 §2
      x-ucos-value-object: true
    ReplayRange:
      type: object
      properties:
        topic:
          description: '|aggregateRef'
        fromSequence:
          description: '|fromTime'
        toSequence:
          description: '|toTime'
        source:
          type: string
          enum:
          - log
          - archive
          - auto
      required:
      - topic
      - fromSequence
      - toSequence
      - source
      x-ucos-value-object: true
  parameters:
    UcosTenant:
      name: UCOS-Tenant
      in: header
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{1,62}$
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
