      x-ucos-invariants: []
      required:
      - code
      - assertion
      - kind
      - implementation
      - frequency
      - owner
      - keyControl
    ReconciliationDefinition:
      type: object
      properties:
        left:
          description: dataset + query
          x-ucos-type: dataset + query
        right:
          description: dataset + query
          x-ucos-type: dataset + query
        matchKeys:
          type: array
          items:
            type: string
        compare:
          type: array
          items:
            type: object
            properties:
              field: {}
              tolerance: {}
            required:
            - field
            - tolerance
        schedule:
          type: string
      x-ucos-identity: urn:ucos:<tenant>:reconciliation:<code>
      x-ucos-invariants:
      - 'INV-FCT-1: left and right sources are registered datasets (DOM-LIN); match keys and tolerances declared; amounts
        compared per currency.'
      required:
      - left
      - right
      - matchKeys
      - compare
      - schedule
    ReconciliationRun:
      type: object
      properties:
        definition:
          type: string
        asOf:
          type: string
          format: date-time
        matched:
          type: integer
          format: int64
        breaks:
          type: array
          items:
            $ref: '#/components/schemas/Break'
        status:
          type: string
          enum:
          - running
          - clean
          - breaks
          - failed
      x-ucos-identity: urn:ucos:<tenant>:reconciliation-run:<ulid>
      x-ucos-invariants: []
      required:
      - definition
      - asOf
      - matched
      - breaks
      - status
    CloseChecklist:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              code: {}
              controlRef: {}
              owner: {}
              status: {}
              evidenceRef: {}
            required:
            - code
            - owner
            - status
            - evidenceRef
        signedOffBy:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: PartyUrn
        status:
          type: string
          enum:
          - open
          - ready
          - signed-off
      x-ucos-identity: urn:ucos:<tenant>:close-checklist:<legalEntity>/<period>
      x-ucos-invariants:
      - 'INV-FCT-2: sign-off only when all key controls for the period have passing results or approved exceptions.'
      required:
      - items
      - status
    Break:
      type: object
      x-ucos-within: ReconciliationRun
      properties:
        breakId: {}
        key: {}
        leftValue: {}
        rightValue: {}
        difference: {}
        category: {}
        assignee: {}
        status: {}
        resolution: {}
        ageDays: {}
      required:
      - breakId
      - key
      - leftValue
      - rightValue
      - difference
      - category
      - assignee
      - status
      - resolution
      - ageDays
    ControlResult:
      type: object
      properties:
        control: {}
        period: {}
        outcome:
          type: string
          enum:
          - pass
          - fail
          - exception
        population: {}
        exceptions:
          type: array
          items: {}
        evidenceRef: {}
      required:
      - control
      - period
      - outcome
      - population
      - exceptions
      - evidenceRef
      x-ucos-value-object: true
