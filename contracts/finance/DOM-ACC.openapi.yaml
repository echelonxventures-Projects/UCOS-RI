components:
  schemas:
    Currency:
      type: object
      properties:
        code:
          type: string
        minorUnits:
          type: integer
        kind:
          type: string
          enum:
          - fiat
          - points
          - token
          - credit
        label:
          $ref: ../kernel/localized-text.schema.json
      x-ucos-identity: urn:ucos:global:currency:<code>
      x-ucos-invariants:
      - 'INV-ACC-1: minor units 0..8 for ISO; non-ISO codes prefixed X- or tenant namespace; immutable minor units once used.'
      required:
      - code
      - minorUnits
      - kind
      - label
    FxRate:
      type: object
      properties:
        from:
          type: string
          pattern: ^[A-Z]{3}$|^X-[A-Z0-9-]+$
        to:
          type: string
          pattern: ^[A-Z]{3}$|^X-[A-Z0-9-]+$
        rateType:
          type: string
          enum:
          - spot
          - daily-close
          - contract
          - budget
        rate:
          description: decimal(20,10)
          x-ucos-type: decimal(20,10)
        asOf:
          type: string
          format: date-time
        source:
          type: string
      x-ucos-identity: urn:ucos:<tenant|global>:fx:<from>-<to>:<rateType>:<asOf>
      x-ucos-invariants:
      - 'INV-ACC-2: rates positive with 10 significant digits; inverse derived not stored unless sourced.'
      required:
      - from
      - to
      - rateType
      - rate
      - asOf
      - source
    JournalEntry:
      type: object
      properties:
        legalEntity:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
        postingDate:
          type: string
          format: date
        sourceEventId:
          description: ULID
          x-ucos-type: ULID
        ruleRef:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: MetadataUrn
        lines:
          type: array
          items:
            $ref: '#/components/schemas/JournalLine'
        status:
          type: string
          enum:
          - posted
          - reversed
        reversalOf:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
      x-ucos-identity: urn:ucos:<tenant>:journal-entry:<ulid>
      x-ucos-invariants:
      - 'INV-ACC-3: Σ debits = Σ credits in transaction currency and in functional currency (rounding difference posted to
        a designated rounding account).'
      - 'INV-ACC-4: posting date falls in an open period of the legal entity.'
      - 'INV-ACC-5: immutable once posted; reversal creates a mirrored entry.'
      required:
      - legalEntity
      - postingDate
      - sourceEventId
      - ruleRef
      - lines
      - status
    AccountingPeriod:
      type: object
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        status:
          type: string
          enum:
          - open
          - closing
          - closed
          - reopened
      x-ucos-identity: urn:ucos:<tenant>:period:<legalEntity>/<code>
      x-ucos-invariants: []
      required:
      - start
      - end
      - status
    AccountMapping:
      type: object
      properties:
        accountKey:
          description: UCOS key (e.g. ar.trade, revenue.recurring, tax.output.vat, deferred-revenue, cash.clearing.psp, inventory.asset,
            cogs)
          x-ucos-type: UCOS key (e.g. ar.trade, revenue.recurring, tax.output.vat, deferred-revenue, cash.clearing.psp, inventory.asset,
            cogs)
        glAccount:
          type: string
        dimensions:
          description: map (cost center, segment)
          x-ucos-type: map (cost center, segment)
      x-ucos-identity: urn:ucos:<tenant>:account-mapping:<legalEntity>/<accountKey>
      x-ucos-invariants: []
      required:
      - accountKey
      - glAccount
      - dimensions
    JournalLine:
      type: object
      x-ucos-within: JournalEntry
      properties:
        accountKey: {}
        amountTxn:
          description: Money
        amountFunctional:
          description: Money
        fxRateRef: {}
        dimensions:
          description: '{legalEntity, costCenter?, product?, market?, channel?}'
        sourceRef: {}
      required:
      - accountKey
      - amountTxn
      - amountFunctional
      - fxRateRef
      - dimensions
      - sourceRef
      x-ucos-unnamed:
      - debit|credit
    TrialBalance:
      type: object
      properties:
        legalEntity: {}
        period: {}
        accounts:
          type: array
          items:
            type: object
            properties:
              accountKey: {}
              debit: {}
              credit: {}
              balance: {}
            required:
            - accountKey
            - debit
            - credit
            - balance
        currency: {}
      required:
      - legalEntity
      - period
      - accounts
      - currency
      x-ucos-value-object: true
  parameters:
    UcosTenant:
      name: UCOS-Tenant
      in: header
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{1,62}$
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema:
            $ref: ../kernel/problem.schema.json
