components:
  schemas:
    Campaign:
      type: object
      properties:
        code:
          type: string
        objective:
          type: string
          enum:
          - acquisition
          - retention
          - clearance
          - launch
          - loyalty
          - custom
        window:
          $ref: ../kernel/interval.schema.json
        audience:
          description: ApplicabilityScope (segments, channels, markets) + eligibility rule refs
          x-ucos-type: ApplicabilityScope (segments, channels, markets) + eligibility rule refs
        promotions:
          type: array
          items:
            $ref: '#/components/schemas/Promotion'
        budget:
          $ref: '#/components/schemas/Budget'
        lifecycleState:
          type: string
      x-ucos-identity: urn:ucos:<tenant>:campaign:<ulid>
      x-ucos-invariants:
      - 'INV-CMP-1: promotions'' windows within campaign window; compiled rules carry campaign scope (campaign dimension)
        and validity.'
      - 'INV-CMP-2: active campaigns have approved promotions whose margin simulation was attached (DOM-PRF) when policy campaign.margin-check
        applies.'
      required:
      - code
      - objective
      - window
      - audience
      - promotions
      - lifecycleState
    Budget:
      type: object
      properties:
        measure:
          type: string
          enum:
          - discount-amount
          - redemptions
          - units
        limit:
          description: Money | integer
          x-ucos-type: Money | integer
        committed:
          description: Money | integer
          x-ucos-type: Money | integer
        reserved:
          description: Money | integer
          x-ucos-type: Money | integer
      x-ucos-identity: urn:ucos:<tenant>:budget:<ulid>
      x-ucos-invariants:
      - 'INV-CMP-3: committed + reserved <= limit at all times (serialized per budget); reservations expire after TTL.'
      required:
      - measure
      - limit
      - committed
      - reserved
    CodePool:
      type: object
      properties:
        promotionRef:
          type: string
        kind:
          type: string
          enum:
          - single-use
          - multi-use
          - personalized
        usageLimitPerCode:
          type: integer
        usageLimitPerParty:
          type: integer
        codes:
          description: hashed codes (stored separately)
          x-ucos-type: hashed codes (stored separately)
      x-ucos-identity: urn:ucos:<tenant>:code-pool:<ulid>
      x-ucos-invariants: []
      required:
      - promotionRef
      - kind
      - usageLimitPerCode
      - usageLimitPerParty
      - codes
    Promotion:
      type: object
      x-ucos-within: Campaign
      properties:
        promotionId: {}
        mechanic:
          description: percent-off|amount-off|fixed-price|bogo|bundle-price|free-item|multiplier|trial
        target:
          description: selector over objects/offers
        conditions:
          description: CEL
        stackingGroup: {}
        exclusive: {}
        window: {}
        codeRequired: {}
      required:
      - promotionId
      - mechanic
      - target
      - conditions
      - stackingGroup
      - exclusive
      - window
      - codeRequired
    Redemption:
      type: object
      x-ucos-within: CodePool/Budget ledger
      properties:
        redemptionId: {}
        code: {}
        party: {}
        orderRef: {}
        amount: {}
        at: {}
        status: {}
      required:
      - redemptionId
      - party
      - orderRef
      - amount
      - at
      - status
    BudgetReservation:
      type: object
      properties:
        reservationId: {}
        budgetRef: {}
        amount: {}
        expiresAt: {}
        status: {}
      required:
      - reservationId
      - budgetRef
      - amount
      - expiresAt
      - status
      x-ucos-value-object: true
  parameters:
    UcosTenant:
      name: UCOS-Tenant
      in: header
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{1,62}$
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema:
            $ref: ../kernel/problem.schema.json
