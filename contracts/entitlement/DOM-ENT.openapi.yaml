components:
  schemas:
    Entitlement:
      type: object
      properties:
        id:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
        holder:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: PartyUrn
        subject:
          type: object
          properties:
            objectRef:
              description: '| capabilityRef | offerRef@version'
          required:
          - objectRef
        quantity:
          description: Quantity? (seats/units)
          x-ucos-type: Quantity? (seats/units)
        meters:
          type: array
          items:
            $ref: '#/components/schemas/MeterAllowance'
        scope:
          description: ApplicabilityScope
          x-ucos-type: ApplicabilityScope
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        source:
          type: object
          properties:
            kind:
              type: string
              enum:
              - order
              - contract
              - subscription
              - membership
              - promotion
              - manual
              - policy
            ref: {}
          required:
          - kind
          - ref
        lifecycleState:
          type: string
        transferable:
          type: boolean
        revision:
          type: integer
          format: int64
      x-ucos-identity: urn:ucos:<tenant>:entitlement:<ulid>
      x-ucos-invariants:
      - 'INV-ENT-1: holder is a Party; seat-based entitlements have holder = organization and assignments to members of that
        organization (DOM-REL membership edge valid).'
      - 'INV-ENT-2: for hard quotas, balance >= 0 at all times (consumption beyond requires overage policy = allow).'
      - 'INV-ENT-3: assigned seats <= seat quantity.'
      - 'INV-ENT-4: source reference is immutable; amendments are recorded as events with source refs.'
      required:
      - id
      - holder
      - subject
      - quantity
      - meters
      - scope
      - validFrom
      - source
      - lifecycleState
      - transferable
      - revision
    MeterAllowance:
      type: object
      x-ucos-within: Entitlement
      properties:
        meterRef: {}
        allowance: {}
        period:
          description: P1M, P1D, lifetime
        resetAlignment:
          description: anniversary|calendar
        rollover:
          description: '{maxCarry, expiresAfter}?'
        overage:
          description: deny|allow|allow-and-rate
        hardLimit: {}
      required:
      - meterRef
      - allowance
      - period
      - resetAlignment
      - rollover
      - overage
    SeatAssignment:
      type: object
      x-ucos-within: Entitlement
      properties:
        assignmentId: {}
        assignee:
          description: PartyUrn
        assignedAt: {}
        unassignedAt: {}
      required:
      - assignmentId
      - assignee
      - assignedAt
      - unassignedAt
    Reservation:
      type: object
      x-ucos-within: BalanceLedger
      properties:
        reservationId: {}
        meterRef: {}
        quantity: {}
        expiresAt: {}
        status: {}
      required:
      - reservationId
      - meterRef
      - quantity
      - expiresAt
      - status
    CheckResult:
      type: object
      properties:
        allowed: {}
        entitlementRefs:
          type: array
          items: {}
        remaining:
          type: object
          additionalProperties:
            $ref: ../kernel/quantity.schema.json
        reasons:
          type: array
          items: {}
        ttlSeconds: {}
      required:
      - allowed
      - entitlementRefs
      - remaining
      - reasons
      - ttlSeconds
      x-ucos-value-object: true
    ConsumptionRecord:
      type: object
      properties:
        entitlementRef: {}
        meterRef: {}
        quantity: {}
        occurredAt: {}
        idempotencyKey: {}
        sourceRef: {}
      required:
      - entitlementRef
      - meterRef
      - quantity
      - occurredAt
      - idempotencyKey
      - sourceRef
      x-ucos-value-object: true
  parameters:
    UcosTenant:
      name: UCOS-Tenant
      in: header
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{1,62}$
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
