components:
  schemas:
    Plugin:
      type: object
      properties:
        id:
          type: string
        version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$
        manifest:
          description: ucos-plugin.yaml (CIC-028-001 §2)
          x-ucos-type: ucos-plugin.yaml (CIC-028-001 §2)
        digest:
          type: string
          pattern: ^(sha256:)?[0-9a-f]{64}$
        publisher:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: OrganizationUrn
        scanResults:
          type: object
          properties:
            sbomRef: {}
            vulns: {}
            licenses: {}
            malware: {}
          required:
          - sbomRef
          - vulns
          - licenses
          - malware
        certificationRef:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
        status:
          type: string
      x-ucos-identity: urn:ucos:global:plugin:<id>@<version>
      x-ucos-invariants:
      - 'INV-EXT-1: manifest valid (VR-028-001-01); digest signed by verified publisher (DOM-TRST purpose plugin-signing).'
      - 'INV-EXT-2: listed only with CertificationRecord at required level for its isolation (CR-028-001-01).'
      required:
      - id
      - version
      - manifest
      - digest
      - publisher
      - scanResults
      - status
    PluginActivation:
      type: object
      properties:
        pluginRef:
          description: id@version
          x-ucos-type: id@version
        scope:
          description: ApplicabilityScope
          x-ucos-type: ApplicabilityScope
        configuration:
          type: object
        secretRefs:
          type: object
          additionalProperties:
            description: secretManagerRef
            x-ucos-type: secretManagerRef
        grantedPermissions:
          type: object
        status:
          type: string
          enum:
          - pending-approval
          - active
          - suspended
          - deactivated
      x-ucos-identity: urn:ucos:<tenant>:plugin-activation:<pluginId>
      x-ucos-invariants:
      - 'INV-EXT-3: configuration validates against configSchema; secrets bound by reference only.'
      - 'INV-EXT-4: granted permissions ⊆ manifest permissions; activation requires approved ChangeSet (CR-028-001-05).'
      required:
      - pluginRef
      - scope
      - configuration
      - secretRefs
      - grantedPermissions
      - status
    Port:
      type: object
      properties:
        name:
          description: e.g. PaymentProviderPort, TaxEnginePort, PriceModelPort, GeocoderPort
          x-ucos-type: e.g. PaymentProviderPort, TaxEnginePort, PriceModelPort, GeocoderPort
        version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$
        contract:
          description: proto/IDL ref
          x-ucos-type: proto/IDL ref
        conformanceSuiteRef:
          type: string
      x-ucos-identity: urn:ucos:global:port:<name>@<version>
      x-ucos-invariants: []
      required:
      - name
      - version
      - contract
      - conformanceSuiteRef
    PermissionGrant:
      type: object
      properties:
        egress:
          type: array
          items: {}
        ucosApis:
          description: '[{api, purpose, fields}]'
        events:
          description: '{consume, produce}'
        secrets:
          type: array
          items: {}
      required:
      - egress
      - ucosApis
      - events
      - secrets
      x-ucos-value-object: true
  parameters:
    UcosTenant:
      name: UCOS-Tenant
      in: header
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{1,62}$
    Traceparent:
      name: traceparent
      in: header
