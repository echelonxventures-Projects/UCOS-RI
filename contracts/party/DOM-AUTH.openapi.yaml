                x-ucos-urn-kind: RoleUrn
            maxDuration:
              type: string
              pattern: ^-?P
          required:
          - byRoles
          - requiresApproval
        sensitivity:
          description: standard|privileged (selects the authority.review-interval)
          x-ucos-type: standard|privileged (selects the authority.review-interval)
      x-ucos-identity: urn:ucos:<namespace>:role:<code>
      x-ucos-invariants:
      - 'INV-AUTH-1: role permissions reference registered permission strings; composite roles acyclic.'
      required:
      - code
      - label
      - permissions
      - includes
      - assignable
      - sensitivity
    RoleAssignment:
      type: object
      properties:
        party:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: PartyUrn
        role:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: RoleUrn
        scope:
          description: ApplicabilityScope
          x-ucos-type: ApplicabilityScope
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        assignedBy:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: PartyUrn
