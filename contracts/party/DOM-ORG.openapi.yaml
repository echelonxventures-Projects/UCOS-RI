        scope:
          description: ApplicabilityScope
          x-ucos-type: ApplicabilityScope
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
      x-ucos-identity: urn:ucos:<tenant>:operating-role:<ulid>
      x-ucos-invariants:
      - 'INV-ORG-5: for each (role, scope) exactly one legal entity at any instant (merchant-of-record, invoice-issuer, tax-remitter,
