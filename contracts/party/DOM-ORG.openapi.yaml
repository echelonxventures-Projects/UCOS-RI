        fiscalCalendarRef:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
        status:
          type: string
          enum:
          - active
          - dormant
          - dissolved
      x-ucos-identity: urn:ucos:<tenant>:legal-entity:<ulid>
      x-ucos-invariants:
      - 'INV-ORG-2: references an Organization party; registrationNumber unique per (country, registry).'
      - 'INV-ORG-3: tax registrations per jurisdiction do not overlap in time.'
      - 'INV-ORG-4: functional currency set and registered in currency registry.'
      required:
      - party
      - country
      - registrations
      - taxRegistrations
      - functionalCurrency
      - fiscalCalendarRef
      - status
    OperatingRoleAssignment:
      type: object
      properties:
        role:
          type: string
          enum:
          - merchant-of-record
          - invoice-issuer
          - tax-remitter
          - contracting-entity
          - payout-entity
        legalEntity:
