        moderation:
          type: object
          properties:
            status: {}
            findings:
              type: array
              items: {}
          required:
          - status
          - findings
        lifecycleState:
          type: string
      x-ucos-identity: urn:ucos:<tenant>:listing:<ulid>
      x-ucos-invariants:
      - 'INV-MKT-2: listing references one catalog object (matched or newly created through governed COB create); seller active;
        price resolvable from the seller''s price list in listing contexts.'
      - 'INV-MKT-3: one active listing per (seller, object, condition).'
