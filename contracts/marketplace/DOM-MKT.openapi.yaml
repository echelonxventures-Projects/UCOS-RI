          x-ucos-urn-kind: InstanceUrn
        stockSource:
          description: seller inventory node | marketplace-fulfilled node
          x-ucos-type: seller inventory node | marketplace-fulfilled node
        fulfillmentMode:
          type: string
          enum:
          - seller-fulfilled
          - marketplace-fulfilled
        scope:
          description: ApplicabilityScope
