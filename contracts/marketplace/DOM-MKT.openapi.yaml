            policies:
              description: returns, shipping) as LocalizedText
          required:
          - name
          - policies
        lifecycleState:
          type: string
      x-ucos-identity: urn:ucos:<tenant>:seller:<ulid>
      x-ucos-invariants:
      - 'INV-MKT-1: active sellers have verified KYB (DOM-TRST/EVD evidence), an active settlement agreement (DOM-STL), and
        a payout method (DOM-PAY).'
      required:
      - party
      - sellerTenant
      - kybStatus
      - settlementAgreementRef
      - storefront
      - lifecycleState
    Listing:
      type: object
      properties:
        seller:
