          x-ucos-urn-kind: InstanceUrn
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        source:
          type: object
          properties:
            kind:
              type: string
              enum:
              - manual
              - import
              - allocation
              - integration
            ref: {}
          required:
          - kind
          - ref
      x-ucos-identity: urn:ucos:<tenant>:extref:<ulid>
      x-ucos-invariants:
      - 'INV-REF-1: (tenant, scheme, issuer, normalizedValue) maps to at most one subject at any instant (temporal uniqueness).'
      - 'INV-REF-2: value validates against the scheme (syntax + check digit).'
      - 'INV-REF-3: subject URN kind is in the scheme''s allowedSubjectKinds.'
      required:
      - id
      - scheme
      - issuer
      - value
      - normalizedValue
      - subject
      - validFrom
      - source
    IdentifierScheme:
      type: object
      properties:
        code:
          description: string (e.g. gs1:gtin, gleif:lei, eu:vat, iso:isbn, legacy:<system>)
          x-ucos-type: string (e.g. gs1:gtin, gleif:lei, eu:vat, iso:isbn, legacy:<system>)
        syntax:
          description: RE2 regex
          x-ucos-type: RE2 regex
        checkDigit:
          type: string
          enum:
          - gs1-mod10
          - iso7064-mod97-10
          - luhn
          - verhoeff
          - none
        normalization:
          type: array
          items:
            type: string
        uniquenessScope:
          type: string
          enum:
          - global
          - tenant
          - issuer
        allowedSubjectKinds:
          description: string[] (URN kinds)
          x-ucos-type: string[] (URN kinds)
      x-ucos-identity: urn:ucos:<namespace>:idscheme:<code>
      x-ucos-invariants:
      - 'INV-REF-4: regex compiles under RE2; checkDigit algorithm registered.'
      required:
      - code
      - syntax
      - checkDigit
      - normalization
      - uniquenessScope
      - allowedSubjectKinds
    CodeList:
      type: object
      properties:
        code:
          description: string (iso3166-1, iso3166-2, iso4217, unece-rec20, unspsc, hs-2022, …)
          x-ucos-type: string (iso3166-1, iso3166-2, iso4217, unece-rec20, unspsc, hs-2022, …)
        version:
          type: string
        effectiveFrom:
          type: string
          format: date
        entries:
          type: array
          items:
            type: object
            properties:
              code: {}
              label:
                $ref: ../kernel/localized-text.schema.json
              parent: {}
              attributes:
                description: map
                x-ucos-type: map
              deprecated:
                type: boolean
              replacedBy: {}
            required:
            - code
            - label
            - attributes
        state:
          type: string
          enum:
          - draft
          - active
          - superseded
      x-ucos-identity: urn:ucos:<namespace>:codelist:<code>@<version>
      x-ucos-invariants:
      - 'INV-REF-5: exactly one active version per code list per effective date; codes unique within a version.'
      required:
      - code
      - version
      - effectiveFrom
      - entries
      - state
    IdentifierRange:
      type: object
      properties:
        scheme:
          type: string
        prefix:
          type: string
        nextValue:
          type: integer
          format: int64
        endValue:
          type: integer
          format: int64
      x-ucos-identity: urn:ucos:<tenant>:idrange:<ulid>
      x-ucos-invariants:
      - 'INV-REF-6: allocations are unique and within [start, end]; exhausted ranges reject allocation.'
      required:
      - scheme
      - prefix
      - nextValue
      - endValue
    ExternalId:
      type: object
      properties: {}
      x-ucos-unnamed:
      - '{scheme, issuer, value} — the published language form used in all APIs and events'
      x-ucos-value-object: true
    Resolution:
