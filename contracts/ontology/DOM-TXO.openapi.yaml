          - dimension-values
          - navigation
          - regulatory
          - segmentation
        version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$
        state:
          description: DefinitionState
          x-ucos-type: DefinitionState
      x-ucos-identity: urn:ucos:<namespace>:taxonomy:<code>@<version>
      x-ucos-invariants:
      - 'INV-TXO-1: broader graph acyclic; if polyhierarchy=false each term has <= 1 broader.'
      - 'INV-TXO-2: term codes unique within taxonomy; term URNs stable across versions.'
      - 'INV-TXO-3: published versions immutable; deprecated terms keep URN with replacedBy.'
      required:
      - code
      - label
      - polyhierarchy
      - purpose
      - version
      - state
    Term:
      type: object
      properties:
        code:
          type: string
        prefLabel:
          $ref: ../kernel/localized-text.schema.json
        altLabels:
          type: array
          items:
            $ref: ../kernel/localized-text.schema.json
        definition:
          $ref: ../kernel/localized-text.schema.json
        broader:
          type: array
          items:
            $ref: ../kernel/urn.schema.json
            x-ucos-urn-kind: TermUrn
        related:
          type: array
          items:
            $ref: ../kernel/urn.schema.json
