components:
  schemas:
    RegistryEntry:
      type: object
      properties:
        registry:
          type: string
          enum:
          - kind
          - error-code
          - reason-code
          - purpose
          - meter
          - unit
          - port
          - fact-kind
          - effect-kind
          - evidence-kind
          - decision-type
          - role
        key:
          type: string
        definition:
          type: object
        contributedBy:
          type: string
          enum:
          - pack
          - plugin
          - kernel
        status:
          type: string
          enum:
          - active
          - deprecated
      x-ucos-identity: urn:ucos:<namespace>:<registry>:<key>
      x-ucos-invariants:
      - 'INV-META-1: (registry, key) unique across platform and installed packs/plugins for a tenant; keys follow the registry''s
        grammar.'
      required:
      - registry
      - key
      - definition
      - contributedBy
      - status
    Pack:
      type: object
      properties:
        id:
          type: string
        version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$
        namespace:
          type: string
        dependencies:
          type: array
          items:
            type: object
            properties:
              id: {}
              range: {}
            required:
            - id
            - range
        digest:
          type: string
          pattern: ^(sha256:)?[0-9a-f]{64}$
        signature:
          description: Sigstore bundle
          x-ucos-type: Sigstore bundle
        certificationRef:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
        realizes:
          type: object
          additionalProperties:
            type: array
            items:
              description: TypeName
              x-ucos-type: TypeName
      x-ucos-identity: urn:ucos:global:pack:<id>@<version>
      x-ucos-invariants:
      - 'INV-META-2: pack digest signed by publisher; CertificationRecord L1+ for the digest before listing.'
      - 'INV-META-3: namespace verified and owned by publisher (DOM-ORG).'
      required:
      - id
      - version
      - namespace
      - dependencies
      - digest
      - signature
      - certificationRef
      - realizes
    PackInstallation:
      type: object
      properties:
        packId:
          type: string
        installedVersion:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$
        changeSetRef:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
        status:
          type: string
          enum:
          - installing
          - installed
          - upgrading
          - uninstalling
          - failed
          - uninstalled
      x-ucos-identity: urn:ucos:<tenant>:pack-installation:<packId>
      x-ucos-invariants:
      - 'INV-META-4: installed version satisfies all dependents'' ranges; uninstall only when no live instance references
        pack definitions.'
      required:
      - packId
      - installedVersion
      - changeSetRef
      - status
    InstallPlan:
      description: '[{packId, version, items: definition counts by kind, migrations[]}] in topological order'
      x-ucos-type: '[{packId, version, items: definition counts by kind, migrations[]}] in topological order'
      x-ucos-value-object: true
  parameters:
    UcosTenant:
      name: UCOS-Tenant
      in: header
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{1,62}$
    Traceparent:
      name: traceparent
      in: header
