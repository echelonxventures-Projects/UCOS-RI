      - 'INV-ONT-3: every facet with required=true has all its required attributes present in the effective schema.'
      - 'INV-ONT-4: a published version is immutable; changes create a new version.'
      - 'INV-ONT-5: abstract=true types cannot be instantiated by DOM-COB.'
      - 'INV-ONT-6: lifecycleModelRef resolves to a published LifecycleModel whose states cover the facet-required states.'
      required:
      - urn
      - namespace
      - name
      - version
      - label
      - description
      - abstract
