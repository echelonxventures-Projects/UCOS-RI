components:
  schemas:
    AgentDefinition:
      type: object
      properties:
        purpose:
          $ref: ../kernel/localized-text.schema.json
        modelRef:
          type: string
        promptTemplates:
          type: array
          items:
            type: object
            properties:
              role: {}
              templateRef: {}
              digest: {}
            required:
            - role
            - templateRef
            - digest
        tools:
          type: array
          items:
            description: toolName
            x-ucos-type: toolName
        autonomy:
          type: string
          enum:
          - suggest
          - act-with-approval
          - act-within-limits
          - act
        guardrails:
          type: object
          properties:
            maxStepsPerSession: {}
            maxSpendPerSession:
              $ref: ../kernel/money.schema.json
            blockedTopics:
              type: array
              items: {}
            outputFilters:
              type: array
              items: {}
          required:
          - maxStepsPerSession
          - maxSpendPerSession
          - blockedTopics
          - outputFilters
        groundingSources:
          type: array
          items:
            description: knowledge|search|kg-query refs
            x-ucos-type: knowledge|search|kg-query refs
        state:
          description: DefinitionState
          x-ucos-type: DefinitionState
      x-ucos-identity: urn:ucos:<namespace|tenant>:agent-definition:<name>@<semver>
      x-ucos-invariants:
      - 'INV-AGT-1: tools subset of published tool catalog; high-risk tools require autonomy act-with-approval unless policy
        ai.high-risk-tools allows.'
      - 'INV-AGT-2: model reference is an approved model version (DOM-INT) or certified provider plugin allowed by sovereignty
        profile.'
      - 'INV-AGT-3: prompt templates are governed content (no tenant secrets; untrusted inputs inserted only into designated
        data slots).'
      required:
      - purpose
      - modelRef
      - promptTemplates
      - tools
      - autonomy
      - guardrails
      - groundingSources
      - state
    AgentInstance:
      type: object
      properties:
        definitionRef:
          description: name@version
          x-ucos-type: name@version
        identityRef:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: IdentityUrn
        partyRef:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: PartyUrn
        ownerParty:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: PartyUrn
        mandateRefs:
          description: InstanceUrn[] (DOM-AUTH)
          x-ucos-type: InstanceUrn[] (DOM-AUTH)
        status:
          type: string
          enum:
          - active
          - suspended
          - retired
      x-ucos-identity: urn:ucos:<tenant>:agent:<ulid>
      x-ucos-invariants:
      - 'INV-AGT-4: bound to exactly one Agent identity and Agent party with accountable owner (INV-IDN-3); spend within profile
        limits at all times.'
      required:
      - definitionRef
      - identityRef
      - partyRef
      - ownerParty
      - mandateRefs
      - status
    AgentSession:
      type: object
      properties:
        agentRef:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
        onBehalfOf:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: PartyUrn
        turns:
          description: digests + redacted transcript (retention policy)
          x-ucos-type: digests + redacted transcript (retention policy)
        actions:
          type: array
          items:
            type: object
            properties:
              toolCall: {}
              decisionRef: {}
              status:
                type: string
                enum:
                - executed
                - pending-approval
                - rejected
                - blocked
            required:
            - toolCall
            - decisionRef
            - status
        spend:
          $ref: ../kernel/money.schema.json
        status:
          type: string
          enum:
          - active
          - ended
          - terminated
      x-ucos-identity: urn:ucos:<tenant>:agent-session:<ulid>
      x-ucos-invariants: []
      required:
      - agentRef
      - onBehalfOf
      - turns
