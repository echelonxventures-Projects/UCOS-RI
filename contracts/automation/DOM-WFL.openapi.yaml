components:
  schemas:
    WorkflowDefinition:
      type: object
      properties:
        schema:
          description: CIC-018-001 §2 WorkflowDefinition
          x-ucos-type: CIC-018-001 §2 WorkflowDefinition
        state:
          description: DefinitionState
          x-ucos-type: DefinitionState
      x-ucos-identity: urn:ucos:<namespace|tenant>:workflow:<name>@<semver>
      x-ucos-invariants:
      - 'INV-WFL-1: every service-task operation exists in a published contract; every human task has queue, form, SLA; run-as
        identity set (VR-018-001-01/02).'
      - 'INV-WFL-2: graph has a start event, reachable end events, no unreachable steps; compensation references valid steps.'
      required:
      - schema
      - state
    WorkflowInstance:
      type: object
      properties:
        definitionRef:
          description: name@version
          x-ucos-type: name@version
        input:
          type: object
        variables:
          type: object
        currentSteps:
          type: array
          items:
            type: string
        correlationKeys:
          description: map
          x-ucos-type: map
        runAs:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: IdentityUrn
        status:
          type: string
      x-ucos-identity: urn:ucos:<tenant>:workflow-instance:<ulid>
      x-ucos-invariants:
      - 'INV-WFL-3: history append-only; each side-effecting step carries idempotency key wf:<instance>:<step>:<lineage>.'
      - 'INV-WFL-4: instance runs on its definition version unless migrated via MigrateWorkflowInstances with mapping.'
      required:
      - definitionRef
      - input
      - variables
      - currentSteps
      - correlationKeys
      - runAs
      - status
    HumanTask:
      type: object
      properties:
        instanceRef:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
        stepId:
          type: string
        queue:
          type: string
        assignee:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: PartyUrn
        formRef:
          description: ViewDefinition URN
          x-ucos-type: ViewDefinition URN
        dueAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - open
          - claimed
          - completed
          - escalated
          - cancelled
      x-ucos-identity: urn:ucos:<tenant>:task:<ulid>
      x-ucos-invariants: []
      required:
      - instanceRef
      - stepId
      - queue
      - formRef
      - dueAt
      - status
    HistoryEntry:
      type: object
      x-ucos-within: WorkflowInstance
      properties:
        seq: {}
        at: {}
        stepId: {}
        kind:
          description: started|completed|failed|compensated|signaled|timer-fired
        payloadDigest: {}
      required:
      - seq
      - at
      - stepId
      - kind
      - payloadDigest
    TaskOutcome:
      type: object
      properties:
        decision: {}
        formData:
          description: validated
        comment: {}
      required:
      - decision
      - formData
      - comment
      x-ucos-value-object: true
  parameters:
    UcosTenant:
      name: UCOS-Tenant
      in: header
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{1,62}$
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema:
            $ref: ../kernel/problem.schema.json
