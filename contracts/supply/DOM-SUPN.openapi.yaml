components:
  schemas:
    SourcingRelationship:
      type: object
      properties:
        supplier:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: PartyUrn
        objectRef:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
        supplierItemRef:
          description: ExternalReference (scheme supplier:<id>)
          x-ucos-type: ExternalReference (scheme supplier:<id>)
        nodeScope:
          description: ApplicabilityScope
          x-ucos-type: ApplicabilityScope
        moq:
          $ref: ../kernel/quantity.schema.json
        packSize:
          $ref: ../kernel/quantity.schema.json
        leadTime:
          type: string
          pattern: ^-?P
        priority:
          type: integer
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
      x-ucos-identity: urn:ucos:<tenant>:sourcing-relationship:<ulid>
      x-ucos-invariants:
      - 'INV-SUPN-1: one primary relationship per (object, node scope, period); MOQ and packSize positive; leadTime set.'
      required:
      - supplier
      - objectRef
      - supplierItemRef
      - nodeScope
      - moq
      - packSize
      - leadTime
      - priority
      - validFrom
    PurchaseOrder:
      type: object
      properties:
        number:
          type: string
        supplier:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: PartyUrn
        buyerEntity:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: LegalEntityUrn
        shipToNode:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
        lines:
          type: array
          items:
            type: object
            properties:
              lineId: {}
              objectRef: {}
              quantity: {}
              unitPrice:
                $ref: ../kernel/money.schema.json
              expectedAt: {}
              receivedQuantity: {}
            required:
            - lineId
            - objectRef
            - quantity
            - unitPrice
            - expectedAt
            - receivedQuantity
        currency:
          type: string
          pattern: ^[A-Z]{3}$|^X-[A-Z0-9-]+$
        lifecycleState:
          type: string
      x-ucos-identity: urn:ucos:<tenant>:purchase-order:<ulid>
      x-ucos-invariants:
      - 'INV-SUPN-2: lines reference active sourcing relationships; quantities multiples of packSize and >= MOQ unless override
        approved.'
      - 'INV-SUPN-3: received quantity per line <= ordered + tolerance (policy supply.receipt-tolerance).'
      required:
      - number
      - supplier
      - buyerEntity
      - shipToNode
      - lines
      - currency
      - lifecycleState
    ReplenishmentProposal:
      type: object
      properties:
        objectRef:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
        nodeRef:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
        suggestedQuantity:
          $ref: ../kernel/quantity.schema.json
        supplier:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: PartyUrn
        rationale:
          type: object
          properties:
            method: {}
            onHand: {}
            onOrder: {}
            demandForecast: {}
            safetyStock: {}
          required:
          - method
          - onHand
          - onOrder
          - demandForecast
          - safetyStock
        status:
          type: string
          enum:
          - proposed
          - approved
          - rejected
          - converted
      x-ucos-identity: urn:ucos:<tenant>:replenishment-proposal:<ulid>
      x-ucos-invariants: []
      required:
      - objectRef
      - nodeRef
      - suggestedQuantity
      - supplier
      - rationale
      - status
    MatchResult:
      type: object
      properties:
        poLine: {}
        receiptRefs:
          type: array
          items: {}
        invoiceRef: {}
        matchType:
          type: string
          enum:
          - two-way
          - three-way
        variances:
          description: '{qty, price}'
        status:
          type: string
          enum:
          - matched
          - exception
      required:
      - poLine
      - receiptRefs
      - matchType
      - variances
      - status
      x-ucos-value-object: true
  parameters:
    UcosTenant:
      name: UCOS-Tenant
      in: header
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{1,62}$
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema:
            $ref: ../kernel/problem.schema.json
