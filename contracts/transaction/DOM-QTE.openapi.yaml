        versions:
          type: array
          items:
            $ref: '#/components/schemas/QuoteVersion'
        currentVersion:
          type: integer
        lifecycleState:
          type: string
        conversion:
          type: object
          properties:
            orderRef: {}
            contractRef: {}
        revision:
          type: integer
          format: int64
      x-ucos-identity: urn:ucos:<tenant>:quote:<ulid>
      x-ucos-invariants:
      - 'INV-QTE-1: a presented version is immutable; changes create a new version and invalidate approvals of the old.'
      - 'INV-QTE-2: every line carries a valid configuration per DOM-OFR at the version''s pricing time.'
      - 'INV-QTE-3: version total equals Price replay of its pricingSnapshotId plus recorded manual adjustments.'
      - 'INV-QTE-4: acceptance only of the latest presented, unexpired, approved version.'
      required:
      - id
      - number
      - customer
      - owner
      - context
      - versions
      - currentVersion
      - lifecycleState
      - conversion
      - revision
    QuoteVersion:
      type: object
      x-ucos-within: Quote
      properties:
        version: {}
        lines:
          type: array
          items:
            $ref: '#/components/schemas/QuoteLine'
        terms:
          description: OfferTerms overrides, PaymentTerms
        pricingSnapshotId: {}
        priceResult: {}
        manualAdjustments:
          type: array
          items: {}
        validUntil: {}
        approvals:
          type: array
          items: {}
        documentRef: {}
        acceptanceEvidenceRef: {}
      required:
