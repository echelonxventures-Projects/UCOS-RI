components:
  schemas:
    ChangeSet:
      type: object
      properties:
        schema:
          description: CIC-015-001 §2 ChangeSet
          x-ucos-type: CIC-015-001 §2 ChangeSet
        contentDigest:
          type: string
          pattern: ^(sha256:)?[0-9a-f]{64}$
      x-ucos-identity: urn:ucos:<tenant>:changeset:<ulid>
      x-ucos-invariants:
      - 'INV-GOV-1: approvals bind to contentDigest; any item change after first approval resets approvals.'
      - 'INV-GOV-2: approvers satisfy plan stages; approver != author; one person counted once unless plan allows.'
      - 'INV-GOV-3: apply only in state approved/scheduled, outside freeze windows unless emergency plan.'
      required:
      - schema
      - contentDigest
    FreezeWindow:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        scope:
          description: contexts/subject kinds
          x-ucos-type: contexts/subject kinds
        reason:
          type: string
      x-ucos-identity: urn:ucos:<tenant|platform>:freeze-window:<ulid>
      x-ucos-invariants: []
      required:
      - from
      - to
      - scope
      - reason
    ConstitutionalDefect:
      type: object
      properties:
        artifacts:
          description: Artifact IDs in conflict
          x-ucos-type: Artifact IDs in conflict
        description:
          type: string
        amendmentChangeSetRef:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
        status:
          type: string
          enum:
          - raised
          - accepted
          - resolved
          - rejected
      x-ucos-identity: urn:ucos:platform:constitutional-defect:<ulid>
      x-ucos-invariants: []
      required:
      - artifacts
      - description
      - status
    ChangeSetItem:
      type: object
      x-ucos-within: ChangeSet
      properties:
        itemId: {}
        subjectKind: {}
        subjectRef: {}
        operation: {}
        compatibility: {}
        dependsOn: {}
        appliedAt: {}
        compensation: {}
      required:
      - itemId
      - subjectKind
      - subjectRef
      - operation
      - compatibility
      - dependsOn
      - appliedAt
      - compensation
    Approval:
      type: object
      x-ucos-within: ChangeSet
      properties:
        stage: {}
        approver: {}
        decision: {}
        comment: {}
        at: {}
        contentDigest: {}
        evidenceRef: {}
      required:
      - stage
      - approver
      - decision
      - comment
      - at
      - contentDigest
      - evidenceRef
    ImpactReport:
      description: CIC-015-001 §3
      x-ucos-value-object: true
    ApprovalPlan:
      description: stages [{approverRoles, quorum, sod}] + coolOffHours
      x-ucos-value-object: true
  parameters:
    UcosTenant:
      name: UCOS-Tenant
      in: header
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{1,62}$
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema:
            $ref: ../kernel/problem.schema.json
