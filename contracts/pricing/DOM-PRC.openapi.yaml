        revision:
          type: integer
          format: int64
      x-ucos-identity: urn:ucos:<tenant>:pricelist:<ulid>
      x-ucos-invariants:
      - 'INV-PRC-1: all entries share the list currency unless list.multiCurrency=true, in which case each entry declares
        currency.'
      - 'INV-PRC-2: no two entries for the same (subject, chargeType, effective scope digest) overlap in validity (exclusion
        constraint).'
      - 'INV-PRC-3: entries of a published list are immutable; changes create a new list version or end-dated successor entries.'
      - 'INV-PRC-4: tiered models have strictly increasing upTo and a final unbounded tier.'
      - 'INV-PRC-5: formula models compile and their CEL cost estimate <= 5000.'
      required:
      - id
      - code
      - label
      - currency
      - multiCurrency
      - scope
      - priority
      - validFrom
      - lifecycleState
      - version
      - revision
