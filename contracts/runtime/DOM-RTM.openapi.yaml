components:
  schemas:
    Cell:
      type: object
      properties:
        region:
          type: string
        kind:
          type: string
          enum:
          - shared
          - dedicated
          - simulation
          - canary
        status:
          type: string
          enum:
          - provisioning
          - active
          - draining
          - drained
          - decommissioned
        capacity:
          type: object
          properties:
            tenants: {}
            writesPerSecond: {}
            storageTb: {}
            utilization: {}
          required:
          - tenants
          - writesPerSecond
          - storageTb
          - utilization
        platformVersion:
          type: string
      x-ucos-identity: urn:ucos:global:cell:<region>/<cell>
      x-ucos-invariants: []
      required:
      - region
      - kind
      - status
      - capacity
      - platformVersion
    TenantPlacement:
      type: object
      properties:
        tenant:
          type: string
        homeCell:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: CellUrn
        standbyCell:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: CellUrn
        status:
          type: string
          enum:
          - active
          - relocating
          - frozen
        version:
          type: integer
          format: int64
      x-ucos-identity: urn:ucos:global:placement:<tenant>
      x-ucos-invariants:
      - 'INV-RTM-1: cell region satisfies tenant residency (DOM-PRI privacy.residency).'
      - 'INV-RTM-2: exactly one home cell per tenant at any instant; relocation uses a write-freeze window.'
      required:
      - tenant
      - homeCell
      - status
      - version
    JobRun:
      type: object
      properties:
        jobKind:
          type: string
        input:
          type: object
        cursor:
          type: string
        progress:
          type: object
          properties:
            total: {}
            processed: {}
            failed: {}
          required:
          - processed
          - failed
        lease:
          type: object
          properties:
            holder: {}
            expiresAt: {}
          required:
          - holder
          - expiresAt
        status:
          type: string
      x-ucos-identity: urn:ucos:<tenant|platform>:job-run:<ulid>
      x-ucos-invariants:
      - 'INV-RTM-3: at most one lease holder; lease renewed every 10s; takeover after 30s without renewal.'
      - 'INV-RTM-4: checkpoint cursor monotonic; side effects keyed by (jobRun, itemKey) for idempotency.'
      required:
      - jobKind
      - input
      - cursor
      - progress
      - lease
      - status
    Schedule:
      type: object
      properties:
        cron:
          description: string (5-field, zone)
          x-ucos-type: string (5-field, zone)
        jobKind:
          type: string
        input:
          type: object
        overlap:
          type: string
          enum:
          - skip
          - queue
          - allow
        enabled:
          type: boolean
      x-ucos-identity: urn:ucos:<tenant|platform>:schedule:<code>
      x-ucos-invariants: []
      required:
      - cron
      - jobKind
      - input
      - overlap
      - enabled
    RouteResolution:
      type: object
      properties:
        tenant: {}
        region: {}
        cell: {}
        gatewayUrl: {}
        directoryVersion: {}
        ttlSeconds: {}
      required:
      - tenant
      - region
      - cell
      - gatewayUrl
      - directoryVersion
      - ttlSeconds
      x-ucos-value-object: true
  parameters:
    UcosTenant:
      name: UCOS-Tenant
      in: header
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{1,62}$
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema:
            $ref: ../kernel/problem.schema.json
