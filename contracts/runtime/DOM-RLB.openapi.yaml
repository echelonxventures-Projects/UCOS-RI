components:
  schemas:
    Slo:
      type: object
      properties:
        context:
          type: string
        sli:
          type: object
          properties:
            kind:
              type: string
              enum:
              - latency
              - availability
              - freshness
              - correctness
            query: {}
          required:
          - kind
          - query
