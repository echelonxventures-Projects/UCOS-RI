          description: decimal (e.g. 0.999) or threshold
          x-ucos-type: decimal (e.g. 0.999) or threshold
        window:
          description: P28D
          x-ucos-type: P28D
        sourceTrace:
          description: DOM ID + key
          x-ucos-type: DOM ID + key
      x-ucos-identity: urn:ucos:platform:slo:<context>/<name>
      x-ucos-invariants:
      - 'INV-RLB-1: each DOM spec runtimeBehavior.slo entry has exactly one Slo; SLI query registered in signal catalog.'
      required:
      - context
      - sli
      - target
      - window
      - sourceTrace
    ChaosExperiment:
      type: object
      properties:
        fault:
          type: string
          enum:
          - pod-kill
          - network-latency
          - dependency-outage
          - cell-kill
          - clock-skew
          - disk-full
          - broker-partition
        target:
          description: cell/context
          x-ucos-type: cell/context
        hypothesis:
          type: string
        abortConditions:
          description: SLI thresholds
          x-ucos-type: SLI thresholds
        schedule:
          type: string
      x-ucos-identity: urn:ucos:platform:chaos:<code>
      x-ucos-invariants:
      - 'INV-RLB-2: blast radius declared (cell/context/tenant set), abort conditions defined; production runs only in canary
        cell or approved windows.'
      required:
      - fault
      - target
      - hypothesis
      - abortConditions
      - schedule
    DrExercise:
      type: object
      properties:
        tier:
          description: T0|T1|T2
          x-ucos-type: T0|T1|T2
        scope:
          description: contexts/cells
          x-ucos-type: contexts/cells
        measuredRpo:
          type: string
          pattern: ^-?P
        measuredRto:
          type: string
          pattern: ^-?P
        passed:
          type: boolean
        evidenceRef:
          $ref: ../kernel/urn.schema.json
          x-ucos-urn-kind: InstanceUrn
      x-ucos-identity: urn:ucos:platform:dr-exercise:<ulid>
      x-ucos-invariants: []
      required:
      - tier
      - scope
      - measuredRpo
      - measuredRto
      - passed
      - evidenceRef
    ExperimentRun:
      type: object
      x-ucos-within: ChaosExperiment
      properties:
        runId: {}
        startedAt: {}
        endedAt: {}
        outcome:
          description: hypothesis-held|violated|aborted
        findings: {}
      required:
      - runId
      - startedAt
      - endedAt
      - outcome
      - findings
    ErrorBudget:
      type: object
      properties:
        slo: {}
        window: {}
        allowedBadEvents: {}
        consumed: {}
        remainingPct: {}
        burnRate1h: {}
        burnRate6h: {}
      required:
      - slo
      - window
      - allowedBadEvents
      - consumed
      - remainingPct
      - burnRate1h
      - burnRate6h
      x-ucos-value-object: true
    GateDecision:
      type: object
      properties:
        context: {}
        allowed: {}
        reason:
