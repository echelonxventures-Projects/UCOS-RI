# Kernel-domain policies for DOM-REF, ORG, AUTH, TXO, RUL, DEC, PRV, SEC, PRI, KGR, META.
defaults:
  auth: &auth
    kind: authorization
    layer: platform
    scope: {}
    combining: deny-overrides
    outputSchema: {$ref: authorization-decision}
  cfg: &cfg
    kind: configuration
    layer: platform
    scope: {}

policies:
  # ---------------- Authorization (CEL, executed vectors) ----------------
  - <<: *auth
    name: reference.bind
    body:
      language: cel
      source: |
        'reference-steward' in principal.roles && principal.tenant == resource.tenant &&
        !(resource.schemeUniqueness == 'global' && !resource.issuerVerified)
          ? {'effect': 'allow'} : {'effect': 'deny'}
    testVectors:
      - {name: tenant-scheme, input: {principal: {tenant: t1, roles: [reference-steward]}, resource: {tenant: t1, schemeUniqueness: tenant, issuerVerified: false}}, context: {}, expectedOutput: {effect: allow}}
      - {name: global-unverified-issuer, input: {principal: {tenant: t1, roles: [reference-steward]}, resource: {tenant: t1, schemeUniqueness: global, issuerVerified: false}}, context: {}, expectedOutput: {effect: deny}}
      - {name: global-verified-issuer, input: {principal: {tenant: t1, roles: [reference-steward]}, resource: {tenant: t1, schemeUniqueness: global, issuerVerified: true}}, context: {}, expectedOutput: {effect: allow}}

  - <<: *auth
    name: organization.admin
    body:
      language: cel
      source: |
        'organization-admin' in principal.roles && principal.acr in ['AAL2', 'AAL3'] &&
        (action != 'designate-operating-role' || 'finance-controller' in principal.roles || resource.approvalRef != '')
          ? {'effect': 'allow'} : {'effect': 'deny'}
    testVectors:
      - {name: register-legal-entity, input: {action: register-legal-entity, principal: {roles: [organization-admin], acr: AAL2}, resource: {approvalRef: ""}}, context: {}, expectedOutput: {effect: allow}}
      - {name: designate-without-finance, input: {action: designate-operating-role, principal: {roles: [organization-admin], acr: AAL2}, resource: {approvalRef: ""}}, context: {}, expectedOutput: {effect: deny}}
      - {name: designate-with-approval, input: {action: designate-operating-role, principal: {roles: [organization-admin], acr: AAL2}, resource: {approvalRef: "urn:ucos:t1:changeset:01J9"}}, context: {}, expectedOutput: {effect: allow}}
      - {name: no-mfa, input: {action: register-legal-entity, principal: {roles: [organization-admin], acr: AAL1}, resource: {approvalRef: ""}}, context: {}, expectedOutput: {effect: deny}}

  - <<: *auth
    name: taxonomy.authoring
    body:
      language: cel
      source: |
        ('taxonomy-author' in principal.roles && resource.purpose != 'regulatory' && resource.namespaceOwner == principal.organization)
        || ('compliance-officer' in principal.roles && resource.purpose == 'regulatory')
          ? {'effect': 'allow'} : {'effect': 'deny'}
    testVectors:
      - {name: author-classification, input: {principal: {organization: o1, roles: [taxonomy-author]}, resource: {purpose: classification, namespaceOwner: o1}}, context: {}, expectedOutput: {effect: allow}}
      - {name: author-regulatory, input: {principal: {organization: o1, roles: [taxonomy-author]}, resource: {purpose: regulatory, namespaceOwner: o1}}, context: {}, expectedOutput: {effect: deny}}
      - {name: compliance-regulatory, input: {principal: {organization: o1, roles: [compliance-officer]}, resource: {purpose: regulatory, namespaceOwner: o1}}, context: {}, expectedOutput: {effect: allow}}

  - <<: *auth
    name: rules.authoring
    body:
      language: cel
      source: |
        resource.regulated ? ('compliance-officer' in principal.roles ? {'effect': 'allow'} : {'effect': 'deny'})
        : (resource.factKind in ['price-adjustment'] && 'pricing-manager' in principal.roles) ? {'effect': 'allow'}
        : (resource.factKind in ['eligibility', 'configuration-constraint', 'catalog-ordering', 'catalog-exclusion'] && 'product-manager' in principal.roles) ? {'effect': 'allow'}
        : ('rules-admin' in principal.roles) ? {'effect': 'allow'}
        : {'effect': 'deny'}
    testVectors:
      - {name: pricing-manager-adjustment, input: {principal: {roles: [pricing-manager]}, resource: {factKind: price-adjustment, regulated: false}}, context: {}, expectedOutput: {effect: allow}}
      - {name: pricing-manager-eligibility, input: {principal: {roles: [pricing-manager]}, resource: {factKind: eligibility, regulated: false}}, context: {}, expectedOutput: {effect: deny}}
      - {name: sellability-needs-compliance, input: {principal: {roles: [rules-admin]}, resource: {factKind: sellability-rule, regulated: true}}, context: {}, expectedOutput: {effect: deny}}
      - {name: compliance-sellability, input: {principal: {roles: [compliance-officer]}, resource: {factKind: sellability-rule, regulated: true}}, context: {}, expectedOutput: {effect: allow}}

  - <<: *auth
    name: kg.vertex.read
    body:
      language: cel
      source: |
        resource.tenant != principal.tenant ? {'effect': 'deny'}
        : resource.label in ['Policy', 'Rule', 'Decision', 'Evidence'] && !('governance-viewer' in principal.roles) ? {'effect': 'deny'}
        : resource.label == 'Party' && !('party-viewer' in principal.roles) ? {'effect': 'deny'}
        : {'effect': 'allow'}
    testVectors:
      - {name: object-vertex, input: {principal: {tenant: t1, roles: []}, resource: {tenant: t1, label: CommercialObject}}, context: {}, expectedOutput: {effect: allow}}
      - {name: policy-vertex-no-role, input: {principal: {tenant: t1, roles: []}, resource: {tenant: t1, label: Policy}}, context: {}, expectedOutput: {effect: deny}}
      - {name: other-tenant, input: {principal: {tenant: t2, roles: [governance-viewer]}, resource: {tenant: t1, label: CommercialObject}}, context: {}, expectedOutput: {effect: deny}}
      - {name: party-viewer, input: {principal: {tenant: t1, roles: [party-viewer]}, resource: {tenant: t1, label: Party}}, context: {}, expectedOutput: {effect: allow}}

  - <<: *auth
    name: packs.install
    body:
      language: cel
      source: |
        'tenant-admin' in principal.roles && resource.certificationLevel in ['L1', 'L2', 'L3'] &&
        (resource.publisherTrusted || resource.publisher == principal.organization)
          ? {'effect': 'allow', 'obligations': [{'kind': 'require-approval', 'params': {'approverRoles': ['platform-governance']}}]}
          : {'effect': 'deny'}
    testVectors:
      - {name: trusted-certified, input: {principal: {organization: o1, roles: [tenant-admin]}, resource: {certificationLevel: L1, publisherTrusted: true, publisher: vendor}}, context: {}, expectedOutput: {effect: allow, obligations: [{kind: require-approval, params: {approverRoles: [platform-governance]}}]}}
      - {name: uncertified, input: {principal: {organization: o1, roles: [tenant-admin]}, resource: {certificationLevel: L0, publisherTrusted: true, publisher: vendor}}, context: {}, expectedOutput: {effect: deny}}
      - {name: untrusted-foreign, input: {principal: {organization: o1, roles: [tenant-admin]}, resource: {certificationLevel: L2, publisherTrusted: false, publisher: vendor}}, context: {}, expectedOutput: {effect: deny}}
      - {name: own-private-pack, input: {principal: {organization: o1, roles: [tenant-admin]}, resource: {certificationLevel: L1, publisherTrusted: false, publisher: o1}}, context: {}, expectedOutput: {effect: allow, obligations: [{kind: require-approval, params: {approverRoles: [platform-governance]}}]}}

  # ---------------- Configuration ----------------
  - <<: *cfg
    name: operating-role.resolution
    outputSchema: {$ref: resolution-config}
    body: {language: static, source: &opRole {dimensionPrecedence: [jurisdiction, territory, market], conflictStrategy: error, cardinality: one, relaxationAllowed: true, fallbackChains: [territory, market], maxFallbackSteps: 8}}
    testVectors: [{name: default, input: {}, context: {}, expectedOutput: *opRole}]

  - <<: *cfg
    name: reference.deprecated-codes
    outputSchema: {type: object, required: [acceptOnWrite], properties: {acceptOnWrite: {type: boolean}, warn: {type: boolean}}}
    body: {language: static, source: &refDeprecated {acceptOnWrite: false, warn: true}}
    testVectors: [{name: default, input: {}, context: {}, expectedOutput: *refDeprecated}]

  - <<: *cfg
    name: authority.max-delegation-depth
    outputSchema: {type: object, required: [maxDepth], properties: {maxDepth: {type: integer, minimum: 1, maximum: 5}}}
    body: {language: static, source: &authDepth {maxDepth: 3}}
    testVectors: [{name: default, input: {}, context: {}, expectedOutput: *authDepth}]

  - <<: *cfg
    name: authority.review-interval
    outputSchema: {type: object, required: [byRoleSensitivity], properties: {byRoleSensitivity: {type: object, required: [standard, privileged], additionalProperties: {type: string, pattern: "^P"}}}}
    body: {language: static, source: &authReview {byRoleSensitivity: {standard: P180D, privileged: P90D}}}
    testVectors: [{name: default, input: {}, context: {}, expectedOutput: *authReview}]

  - <<: *cfg
    name: taxonomy.auto-accept-threshold
    outputSchema: {type: object, required: [minConfidence], properties: {minConfidence: {type: number, minimum: 0, maximum: 1}, excludedPurposes: {type: array, items: {type: string}}}}
    body: {language: static, source: &txoAccept {minConfidence: 0.95, excludedPurposes: [regulatory]}}
    testVectors: [{name: default, input: {}, context: {}, expectedOutput: *txoAccept}]

  - <<: *cfg
    name: decision.sampling
    outputSchema: {type: object, required: [defaultRate], properties: {defaultRate: {type: number, minimum: 0, maximum: 1}, byDecisionType: {type: object, additionalProperties: {type: number, minimum: 0, maximum: 1}}}}
    body: {language: static, source: &decSampling {defaultRate: 0.01, byDecisionType: {authorization: 0.01, recommendation: 0.001, payment-routing: 0.05}}}
    testVectors: [{name: default, input: {}, context: {}, expectedOutput: *decSampling}]

  - <<: *cfg
    name: decision.regulated-types
    outputSchema: {type: object, required: [default], properties: {default: {type: array, items: {type: string}}, byJurisdiction: {type: object, additionalProperties: {type: array, items: {type: string}}}}}
    body: {language: static, source: &decRegulated {default: [eligibility, risk-score, agent-action, contract-fee], byJurisdiction: {EU: [eligibility, risk-score, agent-action, contract-fee, price-personalization]}}}
    testVectors: [{name: default, input: {}, context: {}, expectedOutput: *decRegulated}]

  - <<: *cfg
    name: decision.replay-mismatch-action
    outputSchema: {type: object, required: [regulated, standard], properties: {regulated: {enum: [block-provider-version, alert-only]}, standard: {enum: [block-provider-version, alert-only]}}}
    body: {language: static, source: &decMismatch {regulated: block-provider-version, standard: alert-only}}
    testVectors: [{name: default, input: {}, context: {}, expectedOutput: *decMismatch}]

  - <<: *cfg
    name: provenance.disclosure
    outputSchema: {type: object, required: [defaultAudience, supplierIdentity], properties: {defaultAudience: {enum: [public, b2b, regulator]}, supplierIdentity: {enum: [hidden, tier1-only, full]}, locationPrecision: {enum: [country, region, site]}}}
    body: {language: static, source: &prvDisclosure {defaultAudience: public, supplierIdentity: hidden, locationPrecision: country}}
    testVectors: [{name: default, input: {}, context: {}, expectedOutput: *prvDisclosure}]

  - <<: *cfg
    name: security.crypto-suite
    outputSchema: {type: object, required: [symmetric, signing, hashing, tls], properties: {symmetric: {type: array, items: {enum: [AES-256-GCM]}}, signing: {type: array, items: {enum: [Ed25519, ECDSA-P256]}}, hashing: {type: array, items: {enum: [SHA-256, HMAC-SHA-256, Argon2id]}}, tls: {type: object, required: [minVersion], properties: {minVersion: {enum: ["1.3"]}, hybridPqc: {type: boolean}}}}}
    body: {language: static, source: &secSuite {symmetric: [AES-256-GCM], signing: [Ed25519, ECDSA-P256], hashing: [SHA-256, HMAC-SHA-256, Argon2id], tls: {minVersion: "1.3", hybridPqc: true}}}
    testVectors: [{name: default, input: {}, context: {}, expectedOutput: *secSuite}]

  - <<: *cfg
    name: security.breach-notification
    outputSchema: {type: object, required: [default], properties: {default: {type: object, required: [regulatorWithin], properties: {regulatorWithin: {type: string, pattern: "^PT?"}, subjectsWithin: {type: string}}}, byJurisdiction: {type: object}}}
    body: {language: static, source: &secBreach {default: {regulatorWithin: PT72H, subjectsWithin: "without-undue-delay"}, byJurisdiction: {EU: {regulatorWithin: PT72H, subjectsWithin: "without-undue-delay"}}}}
    testVectors: [{name: default, input: {}, context: {}, expectedOutput: *secBreach}]

  - <<: *cfg
    name: security.break-glass
    outputSchema: {type: object, required: [approverRoles, approvals, maxDuration], properties: {approverRoles: {type: array, minItems: 1}, approvals: {type: integer, minimum: 2}, maxDuration: {type: string, pattern: "^PT"}}}
    body: {language: static, source: &secBg {approverRoles: [security-lead, sre-lead, cto-office], approvals: 2, maxDuration: PT4H}}
    testVectors: [{name: default, input: {}, context: {}, expectedOutput: *secBg}]

  - <<: *cfg
    name: privacy.dsr-deadlines
    outputSchema: {type: object, required: [default], properties: {default: {type: object, required: [deadline], properties: {deadline: {type: string, pattern: "^P"}, maxExtension: {type: string, pattern: "^P"}}}, byJurisdiction: {type: object}}}
    body: {language: static, source: &priDsr {default: {deadline: P30D, maxExtension: P60D}, byJurisdiction: {US-CA: {deadline: P45D, maxExtension: P45D}, BR: {deadline: P15D}}}}
    testVectors: [{name: default, input: {}, context: {}, expectedOutput: *priDsr}]

  - <<: *cfg
    name: privacy.residency
    outputSchema: {type: object, required: [default], properties: {default: {type: object, required: [allowedRegions], properties: {allowedRegions: {type: array, items: {type: string}}, transferMechanisms: {type: array, items: {type: string}}}}, byJurisdiction: {type: object}}}
    body: {language: static, source: &priResidency {default: {allowedRegions: ["*"], transferMechanisms: []}, byJurisdiction: {EU: {allowedRegions: [eu-west-1, eu-central-1], transferMechanisms: [adequacy-decision, scc-2021]}}}}
    testVectors: [{name: default, input: {}, context: {}, expectedOutput: *priResidency}]

  - <<: *cfg
    name: privacy.purpose-binding
    outputSchema: {type: object, required: [mode], properties: {mode: {enum: [strict, monitor]}, requirePurposeHeader: {type: boolean}}}
    body: {language: static, source: &priBinding {mode: strict, requirePurposeHeader: true}}
    testVectors: [{name: default, input: {}, context: {}, expectedOutput: *priBinding}]

  - <<: *cfg
    name: kg.query-limits
    outputSchema: {type: object, required: [maxDepth, maxRows, timeoutMs, costBudgetPerMinute], properties: {maxDepth: {type: integer, maximum: 8}, maxRows: {type: integer}, timeoutMs: {type: integer}, costBudgetPerMinute: {type: integer}}}
    body: {language: static, source: &kgLimits {maxDepth: 8, maxRows: 10000, timeoutMs: 2000, costBudgetPerMinute: 600000}}
    testVectors: [{name: default, input: {}, context: {}, expectedOutput: *kgLimits}]
