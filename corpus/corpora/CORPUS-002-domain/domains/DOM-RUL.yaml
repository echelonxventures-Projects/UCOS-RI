header:
  id: DOM-RUL
  title: Rules Domain Specification
  version: 1.0.0
  status: normative
  authority: Chief Governance Architect
  corpus: CORPUS-002
  dependencies: [CIC-008-001, CIC-011-001, CIC-015-001, CIC-002-001]
  traces: [PRIN-004, PRIN-005, PRIN-016, CIC-008-001]
  certification: [CR-RUL-01, CR-RUL-02, CR-RUL-03]
  validation: [VR-RUL-01, VR-RUL-02]

purpose: >
  Own every business rule and rule set — price adjustments, sellability, eligibility, configuration
  constraints, context derivations, decomposition, classification, risk rules, catalog ordering —
  as governed, versioned, context-scoped metadata evaluated by one engine with DMN hit-policy
  semantics (CIC-008-001).

scope:
  includes:
    - Rule and RuleSet aggregates for every registered fact kind
    - DMN 1.4 decision table import/export compiled to RuleSets
    - Rule compilation (CEL type-check, cost estimation) and the embedded evaluation runtime
    - Rule testing (test vectors), simulation, and coverage analysis
  excludes:
    - Authorization and configuration decisions (DOM-POL)
    - Application of effects to aggregates (owning domains apply returned effects)
    - Fact kind registration (DOM-CTX)

responsibilities:
  - Deterministic, cost-bounded rule evaluation identical across contexts.
  - Rules never have side effects (effects are returned data).
  - Every rule change governed and testable before publish.

principles: [PRIN-004, PRIN-005, PRIN-016]

boundaries:
  upstream: [DOM-CTX, DOM-ONT, DOM-GOV, DOM-TXO]
  downstream: [DOM-PRC, DOM-AVL, DOM-OFR, DOM-ORD, DOM-CAT, DOM-CTX, DOM-FRD, DOM-TXO]

ownership:
  boundedContext: policy
  owningRole: Chief Governance Architect
  service: rules-service
  schema: ucos_policy

capabilities:
  - {id: RUL-C1, name: Author, description: "Author rules/rule sets with conditions, effects, scope, salience, test vectors."}
  - {id: RUL-C2, name: Decision tables, description: "Author and import DMN decision tables."}
  - {id: RUL-C3, name: Compile, description: "Type-check against input schema; static cost; effect-kind validation."}
  - {id: RUL-C4, name: Evaluate, description: "Embedded EvaluateRules (CIC-008-001 §3) in consuming contexts."}
  - {id: RUL-C5, name: Simulate & cover, description: "Run candidate rules over recorded inputs; report hit/changed rates and dead rules."}

services:
  - {name: RuleCommandService, kind: application, operations: [DraftRule, ReviseRule, DraftRuleSet, ImportDecisionTable, AddRuleTestVector, SubmitRule, PublishRule, DeprecateRule]}
  - {name: RuleCompiler, kind: domain-service, contract: "compile(rule) -> program + inputs used + cost estimate + effect validation; rejects cost > 10,000"}
  - {name: RuleRuntime, kind: library, contract: "EvaluateRules(factKind, subject, facts, ctx) per CIC-008-001 §3; compiled programs cached by pinned URN"}
  - {name: RuleQueryService, kind: application, operations: [GetRule, FindRules, ExportDecisionTable, SimulateRules, GetRuleCoverage]}

aggregates:
  - name: Rule
    kernel: true
    identity: "urn:ucos:<namespace>:rule:<name>@<semver>"
    invariants:
      - "INV-RUL-1: factKind registered; effect.kind in factKind.effectKinds."
      - "INV-RUL-2: condition type-checks against inputSchema; cost <= 10,000."
      - "INV-RUL-3: >= 1 test vector with expected match=true and >= 1 with match=false."
      - "INV-RUL-4: published versions immutable."
    fields:
      - {name: urn, type: MetadataUrn}
      - {name: factKind, type: string}
      - {name: scope, type: ApplicabilityScope}
      - {name: validFrom, type: Instant}
      - {name: validTo, type: "Instant?"}
      - {name: priority, type: int}
      - {name: salience, type: int}
      - {name: condition, type: CEL}
      - {name: effect, type: "{kind, params}"}
      - {name: inputSchema, type: JsonSchema}
      - {name: ruleSetRef, type: "MetadataUrn?"}
      - {name: testVectors, type: "[{name, facts, context, expectMatch, expectEffect?}]"}
      - {name: state, type: DefinitionState}
  - name: RuleSet
    identity: "urn:ucos:<namespace>:ruleset:<name>@<semver>"
    invariants: ["INV-RUL-5: all member rules share factKind; hitPolicy unique => test suite proves no overlapping matches on vectors."]
    fields:
      - {name: factKind, type: string}
      - {name: hitPolicy, type: "first|priority|collect|collect-sum|unique|any"}
      - {name: rules, type: "MetadataUrn[]"}
      - {name: dmnSource, type: "DMN XML digest?"}

entities: []

valueObjects:
  - {name: Effect, definition: "{kind, params} returned by evaluation; applied by owning domain"}
  - {name: EvaluationResult, definition: "{effects[], hits[{rule, salience}], trace}"}
  - {name: CoverageReport, definition: "{evaluated, hitsByRule, neverHit[], overlapping[]}"}

commands:
  - {name: DraftRule, input: "Rule draft + changeSetRef", emits: [RuleDrafted]}
  - {name: ReviseRule, input: "{urn, expectedRevision, patch}", emits: [RuleRevised]}
  - {name: DraftRuleSet, input: "RuleSet draft", emits: [RuleSetDrafted]}
  - {name: ImportDecisionTable, input: "{dmnXml, factKind, namespace}", emits: [RuleSetDrafted, RuleDrafted]}
  - {name: AddRuleTestVector, input: "{urn, vector}", emits: [RuleTestVectorAdded]}
  - {name: SubmitRule, input: "{urn}", emits: [RuleSubmitted], preconditions: ["INV-RUL-1..3; all vectors pass"]}
  - {name: PublishRule, input: "{urn, approvalRef}", emits: [RulePublished]}
  - {name: DeprecateRule, input: "{urn, successor?}", emits: [RuleDeprecated]}

queries:
  - {name: GetRule, input: "{urn}", output: Rule}
  - {name: FindRules, input: "{factKind?, state?, scope filter?, cursor, limit}", output: "page"}
  - {name: ExportDecisionTable, input: "{ruleSet}", output: "DMN 1.4 XML"}
  - {name: SimulateRules, input: "{candidateUrns[], sample: {factKind, from, to, max}}", output: "{evaluated, changedOutcomes, diffs[]}", async: true}
  - {name: GetRuleCoverage, input: "{factKind, window}", output: CoverageReport}

apis:
  - {style: REST, path: "/v1/rules/rules", methods: {POST: DraftRule, GET: FindRules}}
  - {style: REST, path: "/v1/rules/rules/{urn}", methods: {GET: GetRule, PATCH: ReviseRule}}
  - {style: REST, path: "/v1/rules/rules/{urn}/test-vectors", methods: {POST: AddRuleTestVector}}
  - {style: REST, path: "/v1/rules/rules/{urn}:submit", methods: {POST: SubmitRule}}
  - {style: REST, path: "/v1/rules/rules/{urn}:publish", methods: {POST: PublishRule}}
  - {style: REST, path: "/v1/rules/rules/{urn}:deprecate", methods: {POST: DeprecateRule}}
  - {style: REST, path: "/v1/rules/rule-sets", methods: {POST: DraftRuleSet}}
  - {style: REST, path: "/v1/rules/rule-sets:import-dmn", methods: {POST: ImportDecisionTable}}
  - {style: REST, path: "/v1/rules/rule-sets/{urn}/dmn", methods: {GET: ExportDecisionTable}}
  - {style: REST, path: "/v1/rules:simulate", methods: {POST: SimulateRules}}
  - {style: REST, path: "/v1/rules/coverage", methods: {GET: GetRuleCoverage}}

events:
  - {type: ucos.policy.rule.drafted.v1, payload: "{urn, factKind}"}
  - {type: ucos.policy.rule.revised.v1, payload: "{urn, revision}"}
  - {type: ucos.policy.rule.test-vector-added.v1, payload: "{urn, name}"}
  - {type: ucos.policy.rule.submitted.v1, payload: "{urn, costEstimate}"}
  - {type: ucos.policy.rule.published.v1, payload: "{urn, factKind, scope, validFrom, validTo}", consumers: [all rule-consuming contexts (cache invalidation via ucosversion)]}
  - {type: ucos.policy.rule.deprecated.v1, payload: "{urn, successor}"}
  - {type: ucos.policy.rule-set.drafted.v1, payload: "{urn, factKind, hitPolicy}"}

stateMachines:
  - name: RuleLifecycle
    initial: draft
    states: [draft, in-review, published, deprecated, retired]
    terminal: [retired]
    transitions:
      - {from: draft, to: in-review, command: SubmitRule}
      - {from: in-review, to: draft, command: ReviseRule}
      - {from: in-review, to: published, command: PublishRule}
      - {from: published, to: deprecated, command: DeprecateRule}
      - {from: deprecated, to: retired, trigger: "validTo passed and no DecisionRecords within replay window reference it"}

rules:
  - {id: RUL-RUL-1, statement: "Rules referencing attributes not in the inputSchema fail compilation; inputSchema derived from fact kind's declared fact model plus ontology effective schemas."}
  - {id: RUL-RUL-2, statement: "Retired rules remain loadable for DecisionRecord replay (CIC-010-001 §6)."}

policies:
  - {urn: "urn:ucos:ucos.std:policy:rules.authoring", purpose: "Who may author rules per fact kind and namespace"}

decisions:
  - {id: DEC-RUL-1, question: "Which effects apply for fact kind F on subject S in context C?", algorithm: "CIC-008-001 §3"}

security:
  permissions: [rules.read, rules.author, rules.publish, rules.simulate]
  dataClassification: "Internal; simulation samples processed in-region with personal fields hashed."
  threats: ["Expensive rules (DoS) -> static cost limits", "Hidden discount rules -> governance + coverage reports"]

governance:
  changeControl: "Publication via ChangeSet with simulation diff for regulated or monetary fact kinds."
  evidence: "Test vector results and simulation reports attached."

runtimeBehavior:
  consistency: "Published rules propagate to embedded runtimes within 5s p99."
  slo: {EvaluateRules_1000_candidates_p99_ms: 5, availability: "embedded"}

persistenceModel:
  store: PostgreSQL schema ucos_policy (shared context; separate tables)
  tables:
    - {name: rules, columns: "tenant_id, urn, fact_kind, scope jsonb, valid_from, valid_to, priority, salience, body jsonb, compiled bytea, state", pk: "(tenant_id, urn)", indexes: ["(tenant_id, fact_kind, state)"]}
    - {name: rule_scope_index, columns: "tenant_id, fact_kind, dimension, value, urn", pk: "(tenant_id, fact_kind, dimension, value, urn)"}
    - {name: rule_sets, columns: "tenant_id, urn, body jsonb", pk: "(tenant_id, urn)"}
    - {name: event_store, columns: "standard"}
    - {name: outbox, columns: "standard"}
  partitioning: "Hash(tenant_id) 16."
  retention: "Indefinite (replay)."

extensionModel:
  extensionPoints: ["New fact kinds and effect kinds (DOM-CTX registry)", "CEL function libraries (plugins)", "DMN dialect importers"]
  forbidden: ["Side-effecting rule bodies", "Turing-complete scripting"]

certificationCriteria:
  - {id: CR-RUL-01, rule: "Passes CIC-008-001 CR-008-001-01..03.", level: L1}
  - {id: CR-RUL-02, rule: "DMN import/export round trip preserves evaluation results on 500 reference tables.", level: L1}
  - {id: CR-RUL-03, rule: "Coverage report flags seeded dead and overlapping rules 100%.", level: L1}
validationRules:
  - {id: VR-RUL-01, rule: "Every rule in packs has >= 1 positive and >= 1 negative test vector."}
  - {id: VR-RUL-02, rule: "Every rule's effect kind is registered for its fact kind."}
