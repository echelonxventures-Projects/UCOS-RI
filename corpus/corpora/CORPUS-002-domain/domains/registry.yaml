header:
  id: CIC-002-002
  title: Domain Registry
  version: 1.0.0
  status: normative
  authority: Chief Architect
  corpus: CORPUS-002
  dependencies:
  - CIC-000-002
  - CIC-002-001
  traces:
  - PRIN-001
  - PRIN-019
  certification: []
  validation:
  - VR-002-002-01
  - VR-002-002-02
tierDefinitions:
  kernel: Closed-set substrate capability; changes require constitutional amendment.
  core: Platform-provided bounded context composed from kernel aggregates.
  pack: Realized purely as ucos.std Type Pack metadata over DOM-COB; no dedicated service.
  extension: Optional bounded context deployed as a certified plugin (CORPUS-028).
validationRules:
  VR-002-002-01: Every domain id is unique and matches ^DOM-[A-Z]{3,5}$.
  VR-002-002-02: A domain with status 'specified' has a DOM-<CODE>.yaml file validating against schemas/domain-spec.schema.json; a domain with status 'realized' has tier 'pack' and is listed in a pack's pack.yaml 'realizes' map; a domain with status 'subsumed' names subsumedBy, a specified domain whose spec lists it under 'subsumes' with coverage.
