header:
  id: DOM-REF
  title: Reference Domain Specification
  version: 1.0.0
  status: normative
  authority: Chief Data Architect
  corpus: CORPUS-002
  dependencies: [CIC-000-002, CIC-002-001, CIC-003-001]
  traces: [PRIN-001, PRIN-022, CIC-000-002]
  certification: [CR-REF-01, CR-REF-02, CR-REF-03]
  validation: [VR-REF-01, VR-REF-02]

purpose: >
  Own every identifier issued outside UCOS (GTIN, LEI, VAT IDs, legacy system keys, partner SKUs,
  MSISDNs, ISBNs, national product codes) and every externally governed code list (ISO 3166, ISO 4217,
  UN/CEFACT units, UNSPSC, HS codes), mapping them to UCOS URNs so that any system can find a UCOS
  aggregate by the identifier it knows.

scope:
  includes:
    - ExternalReference records binding (scheme, issuer, value) to a UCOS URN with validity
    - IdentifierScheme definitions (syntax, check-digit algorithm, issuer, uniqueness scope)
    - Reference code lists (external standards) with versions and effective dates
    - Cross-reference resolution (lookup by external ID, reverse lookup by URN)
    - Identifier allocation from UCOS-managed ranges (e.g. GS1 company prefix ranges) for tenants that issue external IDs
  excludes:
    - UCOS-native identifiers (CIC-000-002; generated by owning services)
    - Tenant-defined taxonomies (DOM-TXO)
    - Identity federation subjects (DOM-IDN)

responsibilities:
  - Single source of truth for external identifiers (PRIN-001); no other domain stores external IDs except as read-model copies.
  - Enforce scheme syntax and uniqueness.
  - Keep reference code lists current and versioned.

principles: [PRIN-001, PRIN-016, PRIN-022]

boundaries:
  upstream: [DOM-GOV, DOM-DXC]
  downstream: [DOM-COB, DOM-PTY, DOM-ORG, DOM-MDM, DOM-IOP, DOM-SRC, DOM-TAX]

ownership:
  boundedContext: identity
  owningRole: Chief Data Architect
  service: reference-service
  schema: ucos_reference

capabilities:
  - {id: REF-C1, name: Bind, description: "Bind external identifiers to UCOS aggregates."}
  - {id: REF-C2, name: Resolve, description: "Resolve external ID -> URN and URN -> external IDs (by scheme)."}
  - {id: REF-C3, name: Schemes, description: "Define identifier schemes with validation and check digits."}
  - {id: REF-C4, name: Code lists, description: "Import, version, and serve external code lists."}
  - {id: REF-C5, name: Allocate, description: "Allocate identifiers from tenant-owned ranges (e.g. GTINs)."}

services:
  - {name: ReferenceCommandService, kind: application, operations: [BindExternalReference, EndExternalReference, DefineIdentifierScheme, ImportCodeListVersion, ActivateCodeListVersion, DefineIdentifierRange, AllocateIdentifier]}
  - {name: SchemeValidator, kind: domain-service, contract: "validate(scheme, value) -> ok | violations; syntax regex (RE2) + check-digit algorithm (gs1-mod10, iso7064-mod97-10, luhn, verhoeff, none) + normalization (trim, uppercase, strip separators)"}
  - {name: ReferenceQueryService, kind: application, operations: [ResolveExternalReference, GetExternalReferences, GetIdentifierScheme, GetCodeList, LookupCode]}

aggregates:
  - name: ExternalReference
    identity: "urn:ucos:<tenant>:extref:<ulid>"
    invariants:
      - "INV-REF-1: (tenant, scheme, issuer, normalizedValue) maps to at most one subject at any instant (temporal uniqueness)."
      - "INV-REF-2: value validates against the scheme (syntax + check digit)."
      - "INV-REF-3: subject URN kind is in the scheme's allowedSubjectKinds."
    fields:
      - {name: id, type: InstanceUrn}
      - {name: scheme, type: string}
      - {name: issuer, type: string}
      - {name: value, type: string}
      - {name: normalizedValue, type: string}
      - {name: subject, type: InstanceUrn}
      - {name: validFrom, type: Instant}
      - {name: validTo, type: "Instant?"}
      - {name: source, type: "{kind: manual|import|allocation|integration, ref}"}
  - name: IdentifierScheme
    identity: "urn:ucos:<namespace>:idscheme:<code>"
    invariants: ["INV-REF-4: regex compiles under RE2; checkDigit algorithm registered."]
    fields:
      - {name: code, type: "string (e.g. gs1:gtin, gleif:lei, eu:vat, iso:isbn, legacy:<system>)"}
      - {name: syntax, type: RE2 regex}
      - {name: checkDigit, type: "gs1-mod10|iso7064-mod97-10|luhn|verhoeff|none"}
      - {name: normalization, type: "string[]"}
      - {name: uniquenessScope, type: "global|tenant|issuer"}
      - {name: allowedSubjectKinds, type: "string[] (URN kinds)"}
  - name: CodeList
    identity: "urn:ucos:<namespace>:codelist:<code>@<version>"
    invariants: ["INV-REF-5: exactly one active version per code list per effective date; codes unique within a version."]
    fields:
      - {name: code, type: "string (iso3166-1, iso3166-2, iso4217, unece-rec20, unspsc, hs-2022, …)"}
      - {name: version, type: string}
      - {name: effectiveFrom, type: Date}
      - {name: entries, type: "[{code, label: LocalizedText, parent?, attributes: map, deprecated?: bool, replacedBy?}]"}
      - {name: state, type: "draft|active|superseded"}
  - name: IdentifierRange
    identity: "urn:ucos:<tenant>:idrange:<ulid>"
    invariants: ["INV-REF-6: allocations are unique and within [start, end]; exhausted ranges reject allocation."]
    fields:
      - {name: scheme, type: string}
      - {name: prefix, type: string}
      - {name: nextValue, type: long}
      - {name: endValue, type: long}

entities: []

valueObjects:
  - {name: ExternalId, definition: "{scheme, issuer, value} — the published language form used in all APIs and events"}
  - {name: Resolution, definition: "{subject: URN, scheme, value, validFrom, validTo} | not-found"}

commands:
  - {name: BindExternalReference, input: "{scheme, issuer, value, subject, validFrom?, source}", emits: [ExternalReferenceBound], preconditions: ["INV-REF-1..3", "PDP reference.bind on subject"]}
  - {name: EndExternalReference, input: "{id, validTo, reason}", emits: [ExternalReferenceEnded]}
  - {name: DefineIdentifierScheme, input: "IdentifierScheme + changeSetRef", emits: [IdentifierSchemeDefined]}
  - {name: ImportCodeListVersion, input: "{code, version, effectiveFrom, sourceRef (file/URL digest)}", emits: [CodeListVersionImported], async: true}
  - {name: ActivateCodeListVersion, input: "{code, version, approvalRef}", emits: [CodeListVersionActivated]}
  - {name: DefineIdentifierRange, input: "{scheme, prefix, start, end}", emits: [IdentifierRangeDefined]}
  - {name: AllocateIdentifier, input: "{rangeId, subject, idempotencyKey}", emits: [IdentifierAllocated, ExternalReferenceBound]}

queries:
  - {name: ResolveExternalReference, input: "{scheme, issuer?, value, asOf?}", output: Resolution, consistency: strong}
  - {name: GetExternalReferences, input: "{subject, scheme?}", output: "ExternalReference[]"}
  - {name: GetIdentifierScheme, input: "{code}", output: IdentifierScheme}
  - {name: GetCodeList, input: "{code, version?, asOf?}", output: CodeList}
  - {name: LookupCode, input: "{codeList, code, asOf?, locale?}", output: "entry (localized)"}

apis:
  - {style: REST, path: "/v1/reference/external-references", methods: {POST: BindExternalReference, GET: GetExternalReferences}}
  - {style: REST, path: "/v1/reference/external-references/{id}:end", methods: {POST: EndExternalReference}}
  - {style: REST, path: "/v1/reference:resolve", methods: {GET: ResolveExternalReference}, cache: "T1/T2 keyed (scheme, issuer, normalizedValue, version)"}
  - {style: REST, path: "/v1/reference/schemes", methods: {POST: DefineIdentifierScheme}}
  - {style: REST, path: "/v1/reference/schemes/{code}", methods: {GET: GetIdentifierScheme}}
  - {style: REST, path: "/v1/reference/code-lists", methods: {POST: ImportCodeListVersion}}
  - {style: REST, path: "/v1/reference/code-lists/{code}", methods: {GET: GetCodeList}}
  - {style: REST, path: "/v1/reference/code-lists/{code}/versions/{version}:activate", methods: {POST: ActivateCodeListVersion}}
  - {style: REST, path: "/v1/reference/code-lists/{code}/codes/{value}", methods: {GET: LookupCode}}
  - {style: REST, path: "/v1/reference/ranges", methods: {POST: DefineIdentifierRange}}
  - {style: REST, path: "/v1/reference/ranges/{id}:allocate", methods: {POST: AllocateIdentifier}}

events:
  - {type: ucos.identity.external-reference.bound.v1, payload: "{id, scheme, issuer, value, subject, validFrom}", consumers: [search, mdm, interoperability]}
  - {type: ucos.identity.external-reference.ended.v1, payload: "{id, validTo}"}
  - {type: ucos.identity.id-scheme.defined.v1, payload: "{code}"}
  - {type: ucos.identity.code-list.version-imported.v1, payload: "{code, version, entries}"}
  - {type: ucos.identity.code-list.version-activated.v1, payload: "{code, version, effectiveFrom}"}
  - {type: ucos.identity.id-range.defined.v1, payload: "{id, scheme, prefix}"}
  - {type: ucos.identity.id-range.allocated.v1, payload: "{rangeId, value, subject}"}

stateMachines:
  - name: CodeListVersionLifecycle
    initial: draft
    states: [draft, active, superseded]
    terminal: [superseded]
    transitions:
      - {from: draft, to: active, command: ActivateCodeListVersion}
      - {from: active, to: superseded, trigger: "newer version activated with effectiveFrom reached"}

rules:
  - {id: RUL-REF-1, statement: "Lookups normalize input per scheme before matching; responses echo the canonical normalized value."}
  - {id: RUL-REF-2, statement: "Ending a reference never deletes it; historical resolution with asOf returns the subject valid at that time."}
  - {id: RUL-REF-3, statement: "Deprecated codes remain resolvable with replacedBy pointer; writes using deprecated codes are rejected unless policy reference.deprecated-codes allows."}

policies:
  - {urn: "urn:ucos:ucos.std:policy:reference.bind", purpose: "Who may bind/end external identifiers for which subject kinds"}
  - {urn: "urn:ucos:ucos.std:policy:reference.deprecated-codes", purpose: "Whether deprecated code-list codes are accepted on write"}

decisions:
  - {id: DEC-REF-1, question: "Which UCOS aggregate does external ID X denote at time T?", algorithm: "Normalize -> exact match on (scheme, issuer?, normalizedValue) with validity covering T"}

security:
  permissions: [reference.read, reference.bind, reference.scheme.define, reference.codelist.manage, reference.range.allocate]
  dataClassification: "Mostly public/internal; identifiers of persons (national IDs) are owned by DOM-PTY as encrypted attributes, never bound here in clear (schemes flagged personal are rejected)."
  threats: ["Identifier hijack (binding a competitor's GTIN) -> scheme issuer verification policy for global schemes; disputes resolved via governance"]

governance:
  changeControl: "Schemes and code-list activations via ChangeSet; bindings governed by PDP only."
  evidence: "Code-list imports record source digest as Evidence."

runtimeBehavior:
  consistency: "Strong for bind (uniqueness via exclusion constraint); resolve served from cache version-keyed by binding events."
  slo: {ResolveExternalReference_p99_ms: 5, availability: "99.99%"}
  scale: "10^10 references; 100,000 resolutions/s per region."

persistenceModel:
  store: PostgreSQL schema ucos_reference
  tables:
    - {name: external_references, columns: "tenant_id uuid, id char(26), scheme text, issuer text, value text, normalized_value text, subject text, valid_from timestamptz, valid_to timestamptz", pk: "(tenant_id, id)", indexes: ["EXCLUDE USING gist (tenant_id WITH =, scheme WITH =, issuer WITH =, normalized_value WITH =, tstzrange(valid_from, valid_to) WITH &&)", "(tenant_id, subject)"]}
    - {name: identifier_schemes, columns: "tenant_id, code, body jsonb", pk: "(tenant_id, code)"}
    - {name: code_list_entries, columns: "code_list text, version text, code text, body jsonb", pk: "(code_list, version, code)", global: true}
    - {name: identifier_ranges, columns: "tenant_id, id, scheme, prefix, next_value, end_value", pk: "(tenant_id, id)"}
    - {name: event_store, columns: "standard"}
    - {name: outbox, columns: "standard"}
  partitioning: "external_references hash(tenant_id) 64."
  retention: "Indefinite (historical resolution)."

extensionModel:
  extensionPoints: ["New identifier schemes and check-digit algorithms (cel-library plugins)", "Code-list importers per standards body (plugins)"]
  forbidden: ["External IDs as primary keys anywhere (CIC-000-002 §3 rule 5)"]

certificationCriteria:
  - {id: CR-REF-01, rule: "Check-digit algorithm test vectors (GS1, ISO 7064, Luhn, Verhoeff) pass 100%.", level: L1}
  - {id: CR-REF-02, rule: "Concurrent binding of the same external ID to different subjects never results in two valid bindings.", level: L1}
  - {id: CR-REF-03, rule: "ResolveExternalReference p99 <= 5ms at 100,000 rps.", level: L2}
validationRules:
  - {id: VR-REF-01, rule: "Every external-ID attribute in packs (e.g. gtin) names a registered scheme."}
  - {id: VR-REF-02, rule: "Code lists referenced by dimensions (iso-3166, currencies) have an active version."}
