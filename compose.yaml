# ucos-lite composition (CIC-030-001 §2): one Compose project, one PostgreSQL with a schema per context,
# CloudEvents HTTP EventBusPort adapter. Development credentials only — never used outside ucos-lite.
name: ucos-lite

x-dev-secrets: &dev-secrets
  UCOS_OWNER_PASSWORD: ${UCOS_OWNER_PASSWORD:-owner-dev}
  UCOS_ECHO_APP_PASSWORD: ${UCOS_ECHO_APP_PASSWORD:-echo-app-dev}
  UCOS_ECHO_RELAY_PASSWORD: ${UCOS_ECHO_RELAY_PASSWORD:-echo-relay-dev}
  UCOS_KERNEL_APP_PASSWORD: ${UCOS_KERNEL_APP_PASSWORD:-kernel-app-dev}
  UCOS_KERNEL_RELAY_PASSWORD: ${UCOS_KERNEL_RELAY_PASSWORD:-kernel-relay-dev}
  UCOS_EVENTING_APP_PASSWORD: ${UCOS_EVENTING_APP_PASSWORD:-eventing-app-dev}
  UCOS_EVENTING_RELAY_PASSWORD: ${UCOS_EVENTING_RELAY_PASSWORD:-eventing-relay-dev}
  UCOS_IDENTITY_APP_PASSWORD: ${UCOS_IDENTITY_APP_PASSWORD:-identity-app-dev}
  UCOS_IDENTITY_RELAY_PASSWORD: ${UCOS_IDENTITY_RELAY_PASSWORD:-identity-relay-dev}
  UCOS_COMMERCE_APP_PASSWORD: ${UCOS_COMMERCE_APP_PASSWORD:-commerce-app-dev}
  UCOS_COMMERCE_RELAY_PASSWORD: ${UCOS_COMMERCE_RELAY_PASSWORD:-commerce-relay-dev}

services:
  db:
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea  # postgres:16-alpine
    environment:
      <<: *dev-secrets
      POSTGRES_DB: ucos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${UCOS_DB_SUPERUSER_PASSWORD:-postgres-dev}
    volumes:
      - ./deploy/lite/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ucos"]
      interval: 2s
      timeout: 3s
      retries: 30

  tools:
    build: {context: ., dockerfile: tools/Containerfile}
    image: ucos-tools:local
    user: "${UCOS_UID:-0}:${UCOS_GID:-0}"
    working_dir: /work
    volumes: [".:/work"]
    profiles: [tools]

  migrate:
    image: ucos-tools:local
    depends_on: {db: {condition: service_healthy}}
    working_dir: /work
    volumes: [".:/work:ro"]
    environment:
      UCOS_MIGRATE_DB_URL: postgresql://ucos_owner:${UCOS_OWNER_PASSWORD:-owner-dev}@db:5432/ucos
    command: ["python", "tools/migrate.py", "domains/echo", "kernel/ontology", "kernel/lifecycle", "kernel/contextreg",
              "kernel/policy", "kernel/governance", "kernel/evidence", "services/eventing", "services/identity",
              "services/commerce/commerce-service", "services/commerce/cob", "services/commerce/rel",
              "services/commerce/prc", "services/commerce/cat", "services/commerce/ofr"]

  echo:
    build: {context: ., dockerfile: domains/echo/Containerfile, target: runtime}
    image: ucos-echo-service:local
    depends_on: {migrate: {condition: service_completed_successfully}}
    environment:
      UCOS_ECHO_DB_URL: postgresql://ucos_echo_app:${UCOS_ECHO_APP_PASSWORD:-echo-app-dev}@db:5432/ucos
      UCOS_ECHO_RELAY_DB_URL: postgresql://ucos_echo_relay:${UCOS_ECHO_RELAY_PASSWORD:-echo-relay-dev}@db:5432/ucos
      UCOS_EVENTBUS_HTTP_SINKS: http://echo:8081/events
      UCOS_TOKEN_ISSUER: http://identity:8080
      UCOS_PUBLIC_URL: http://echo:8080
      UCOS_REGION: lite
    ports: ["127.0.0.1:${UCOS_ECHO_PORT:-18080}:8080"]

  metadata:
    build: {context: ., dockerfile: kernel/Containerfile, target: runtime}
    image: ucos-metadata-service:local
    depends_on: {migrate: {condition: service_completed_successfully}}
    environment:
      UCOS_KERNEL_DB_URL: postgresql://ucos_kernel_app:${UCOS_KERNEL_APP_PASSWORD:-kernel-app-dev}@db:5432/ucos
      UCOS_KERNEL_RELAY_DB_URL: postgresql://ucos_kernel_relay:${UCOS_KERNEL_RELAY_PASSWORD:-kernel-relay-dev}@db:5432/ucos
      UCOS_TOKEN_ISSUER: http://identity:8080
      UCOS_PUBLIC_URL: http://metadata:8080
      UCOS_CLOCK: adjustable     # ucos-lite only: lets suites exercise cool-off and freeze windows
      UCOS_FAULTS: enabled       # ucos-lite only: apply-saga fault injection (CR-015-001-04)
      UCOS_REGION: lite
      # Governed definitions owned by other services (remote owner protocol, ADR 0009) and the governance client
      UCOS_REMOTE_OWNERS: http://identity:8080=role,sod-conflict-set,authority-limit
      UCOS_SERVICE_CLIENT_ID: metadata-service
      UCOS_SERVICE_CLIENT_SECRET: ${UCOS_METADATA_CLIENT_SECRET:-metadata-client-dev-secret}
    ports: ["127.0.0.1:${UCOS_METADATA_PORT:-18090}:8080"]

  # DOM-EVT event registry. Two implementations of one contract and schema (CR-030-001-05); select with
  # UCOS_EVENTING_IMPL=go|typescript — no other service changes.
  eventing:
    build: {context: ., dockerfile: "services/eventing/${UCOS_EVENTING_IMPL:-go}/Containerfile", target: runtime}
    image: "ucos-eventing-${UCOS_EVENTING_IMPL:-go}:local"
    depends_on: {migrate: {condition: service_completed_successfully}}
    environment:
      UCOS_EVENTING_DB_URL: postgresql://ucos_eventing_app:${UCOS_EVENTING_APP_PASSWORD:-eventing-app-dev}@db:5432/ucos
      UCOS_EVENTING_RELAY_DB_URL: postgresql://ucos_eventing_relay:${UCOS_EVENTING_RELAY_PASSWORD:-eventing-relay-dev}@db:5432/ucos
      UCOS_TOKEN_ISSUER: http://identity:8080
      UCOS_PUBLIC_URL: http://eventing:8080
      UCOS_METADATA_URL: http://metadata:8080
      UCOS_SERVICE_CLIENT_ID: event-platform-service
      UCOS_SERVICE_CLIENT_SECRET: ${UCOS_EVENTING_CLIENT_SECRET:-eventing-client-dev-secret}
    ports: ["127.0.0.1:${UCOS_EVENTING_PORT:-18100}:8080"]

  dex:
    image: ghcr.io/dexidp/dex@sha256:bc7cfce7c17f52864e2bb2a4dc1d2f86a41e3019f6d42e81d92a301fad0c8a1d  # v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes: ["./deploy/lite/dex/config.yaml:/etc/dex/config.yaml:ro"]

  # DOM-IDN token service + DOM-PTY + DOM-AUTH (S2). Issuer = UCOS_PUBLIC_URL.
  identity:
    build: {context: ., dockerfile: services/identity/go/Containerfile, target: runtime}
    image: ucos-identity-service:local
    depends_on: {migrate: {condition: service_completed_successfully}, dex: {condition: service_started}}
    environment:
      UCOS_IDENTITY_DB_URL: postgresql://ucos_identity_app:${UCOS_IDENTITY_APP_PASSWORD:-identity-app-dev}@db:5432/ucos
      UCOS_IDENTITY_RELAY_DB_URL: postgresql://ucos_identity_relay:${UCOS_IDENTITY_RELAY_PASSWORD:-identity-relay-dev}@db:5432/ucos
      UCOS_IDENTITY_KEK: ${UCOS_IDENTITY_KEK:-6c6974652d6f6e6c792d6465762d6b656b2d6e6f742d666f722d70726f642121}  # lite only; KMS in production
      UCOS_PUBLIC_URL: http://identity:8080
      UCOS_METADATA_URL: http://metadata:8080
      UCOS_SERVICE_CLIENTS: event-platform-service:${UCOS_EVENTING_CLIENT_SECRET:-eventing-client-dev-secret},metadata-service:${UCOS_METADATA_CLIENT_SECRET:-metadata-client-dev-secret},commerce-service:${UCOS_COMMERCE_CLIENT_SECRET:-commerce-client-dev-secret}
      UCOS_GOVERNANCE_CLIENTS: metadata-service   # may obtain ucos:platform:admin (remote owner protocol, ADR 0009)
      UCOS_TEST_TOKENS: enabled   # ucos-lite only: conformance suites mint tokens for arbitrary principals (ADR 0008)
      UCOS_CLOCK: adjustable      # ucos-lite only: authority clock for review-interval suites (ADR 0010)
    ports: ["127.0.0.1:${UCOS_IDENTITY_PORT:-18110}:8080"]

  # Commercial core (S3): DOM-COB (S3a), then REL, CAT, PRC, OFR — one deployable in ucos-lite, a schema per context.
  commerce:
    build: {context: ., dockerfile: services/commerce/go/Containerfile, target: runtime}
    image: ucos-commerce-service:local
    depends_on: {migrate: {condition: service_completed_successfully}}
    environment:
      UCOS_COMMERCE_DB_URL: postgresql://ucos_commerce_app:${UCOS_COMMERCE_APP_PASSWORD:-commerce-app-dev}@db:5432/ucos
      UCOS_COMMERCE_RELAY_DB_URL: postgresql://ucos_commerce_relay:${UCOS_COMMERCE_RELAY_PASSWORD:-commerce-relay-dev}@db:5432/ucos
      UCOS_TOKEN_ISSUER: http://identity:8080
      UCOS_PUBLIC_URL: http://commerce:8080
      UCOS_METADATA_URL: http://metadata:8080
      UCOS_SERVICE_CLIENT_ID: commerce-service
      UCOS_SERVICE_CLIENT_SECRET: ${UCOS_COMMERCE_CLIENT_SECRET:-commerce-client-dev-secret}
      UCOS_IDENTITY_URL: http://identity:8080
      UCOS_CLOCK: adjustable     # ucos-lite only
      UCOS_REGION: lite
    ports: ["127.0.0.1:${UCOS_COMMERCE_PORT:-18120}:8080"]

  conformance:
    image: ucos-tools:local
    profiles: [test]
    depends_on: {echo: {condition: service_started}, metadata: {condition: service_started}, eventing: {condition: service_started}, identity: {condition: service_started}, commerce: {condition: service_started}}
    working_dir: /work
    volumes: [".:/work:ro"]
    environment:
      UCOS_BASE_URL: http://echo:8080
      UCOS_CONSUMER_URL: http://echo:8081/events
      UCOS_DB_URL: postgresql://ucos_echo_app:${UCOS_ECHO_APP_PASSWORD:-echo-app-dev}@db:5432/ucos
      UCOS_EVENTING_URL: http://eventing:8080
      UCOS_EVENTING_IMPL: ${UCOS_EVENTING_IMPL:-go}
      UCOS_EVENTING_DB_URL: postgresql://ucos_eventing_app:${UCOS_EVENTING_APP_PASSWORD:-eventing-app-dev}@db:5432/ucos
      UCOS_IDENTITY_URL: http://identity:8080
      UCOS_IDENTITY_ADMIN_URL: http://identity:8081
      UCOS_IDENTITY_DB_URL: postgresql://ucos_identity_app:${UCOS_IDENTITY_APP_PASSWORD:-identity-app-dev}@db:5432/ucos
      UCOS_METADATA_URL: http://metadata:8080
      UCOS_METADATA_ADMIN_URL: http://metadata:8081
      UCOS_COMMERCE_URL: http://commerce:8080
      UCOS_COMMERCE_ADMIN_URL: http://commerce:8081
      UCOS_COMMERCE_DB_URL: postgresql://ucos_commerce_app:${UCOS_COMMERCE_APP_PASSWORD:-commerce-app-dev}@db:5432/ucos
      UCOS_KERNEL_DB_URL: postgresql://ucos_kernel_app:${UCOS_KERNEL_APP_PASSWORD:-kernel-app-dev}@db:5432/ucos
      UCOS_RELAY_DB_URL: postgresql://ucos_echo_relay:${UCOS_ECHO_RELAY_PASSWORD:-echo-relay-dev}@db:5432/ucos
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["python", "-m", "pytest", "-p", "no:cacheprovider", "-q", "conformance"]
